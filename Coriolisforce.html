<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>コリオリ力 3Dインタラクティブシミュレーター</title>
<!-- Three.js (3Dグラフィックス) & OrbitControls (カメラ操作) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  :root {
    --bg-base: #080c14;
    --panel-bg: rgba(15, 23, 42, 0.75);
    --panel-border: rgba(255, 255, 255, 0.1);
    --accent-blue: #38bdf8;
    --accent-indigo: #6366f1;
    --accent-amber: #f59e0b;
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --accent-pink: #ec4899;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  
  body {
    background: var(--bg-base);
    background-image: 
      radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.05) 0px, transparent 50%),
      radial-gradient(at 80% 80%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
    color: var(--text-main);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 20px;
    width: 100%;
    max-width: 1100px;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
    color: var(--accent-blue);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-emerald);
    box-shadow: 0 0 8px var(--accent-emerald);
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* メインレイアウト */
  .main-layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 1100px;
    width: 100%;
    justify-content: center;
  }

  /* ビューポート（キャンバスエリア） */
  .view-container {
    background: #020617;
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.05);
    position: relative;
    width: 580px;
    height: 580px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; border-radius: 15px; }
  /* 3Dキャンバス: タッチでのカメラ操作時にページスクロール等を抑止 */
  #canvas3d, #canvas3d canvas {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* コントロールパネル */
  .control-panel {
    flex: 1;
    min-width: 320px;
    max-width: 480px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* セグメントタブ */
  .tab-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    background: rgba(2, 6, 23, 0.6);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .tab-btn {
    padding: 10px 4px;
    border: none;
    background: transparent;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    color: var(--text-muted);
    font-size: 11px;
    border-radius: 7px;
    transition: all 0.2s ease;
    text-align: center;
  }
  .tab-btn.active {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* コントロールグループ */
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(2, 6, 23, 0.4);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .label-flex {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .val-badge {
    color: var(--accent-blue);
    font-family: monospace;
    font-size: 12px;
    background: rgba(56, 189, 248, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid rgba(56, 189, 248, 0.2);
  }

  /* スライダーカスタムデザイン */
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent-blue);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-blue);
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* ボタンデザイン */
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .btn {
    padding: 10px 8px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-weight: 600;
    font-size: 11px;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.2s ease;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: rgba(2, 132, 199, 0.2); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
  .btn-primary:hover { background: rgba(2, 132, 199, 0.4); }
  .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border-color: rgba(255, 255, 255, 0.1); }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
  .btn-accent { background: rgba(124, 58, 237, 0.2); color: #c084fc; border-color: rgba(192, 132, 252, 0.3); }
  .btn-accent:hover { background: rgba(124, 58, 237, 0.4); }
  .btn-pink { background: rgba(236, 72, 153, 0.2); color: #f472b6; border-color: rgba(236, 72, 153, 0.3); }
  .btn-pink:hover { background: rgba(236, 72, 153, 0.4); }
  .btn-toggle { background: rgba(16, 185, 129, 0.2); color: #34d399; border-color: rgba(52, 211, 153, 0.3); }
  .btn-toggle.off { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border-color: rgba(255, 255, 255, 0.1); }

  /* ビューポートオーバーレイ */
  .view-overlay {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(2, 6, 23, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--accent-blue);
    font-weight: 700;
    letter-spacing: 0.5px;
    pointer-events: none;
    z-index: 10;
  }
  .legend-overlay {
    position: absolute;
    bottom: 14px;
    left: 14px;
    background: rgba(2, 6, 23, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 11px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    pointer-events: none;
    z-index: 10;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 11px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* タブレット・スマートフォン向けレスポンシブ対応 */
  @media (max-width: 640px) {
    .view-container {
      width: 100%;
      max-width: 580px;
      height: auto;
      aspect-ratio: 1 / 1;
    }
    .control-panel {
      min-width: 0;
      width: 100%;
      max-width: 580px;
    }
  }

  /* タッチデバイス向け: 操作ターゲット拡大 */
  @media (pointer: coarse) {
    .btn, .tab-btn { min-height: 44px; }
    input[type="range"] { height: 8px; }
    input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; }
    input[type="range"]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: none;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge"><span class="status-dot"></span> Interactive Physics Engine</div>
  <h1>コリオリの力シミュレーター</h1>
</div>

<div class="main-layout">
  <div class="view-container" id="canvasContainer">
    <!-- 2D Canvas (モード1, 4用) -->
    <canvas id="canvas2d" width="580" height="580"></canvas>
    <!-- 3D Canvas Container (モード2, 3用) -->
    <div id="canvas3d" style="width:100%; height:100%; display:none;"></div>
    
    <div id="overlayTag" class="view-overlay">MODE 1: 的当て (回転盤)</div>
    <div id="legendBox" class="legend-overlay" style="display:none;"></div>
  </div>
  
  <div class="control-panel">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="setMode(1)">1. 的当て</button>
      <button class="tab-btn" onclick="setMode(2)">2. 長振り子 (フーコー)</button>
      <button class="tab-btn" onclick="setMode(3)">3. 3D立体地球</button>
      <button class="tab-btn" onclick="setMode(4)">4. 日本マップ</button>
    </div>

    <!-- モード1 コントロール -->
    <div id="ctrl-mode1" class="control-group">
      <div class="label-flex">
        <span>視点モード</span>
        <span id="viewLabel1" class="val-badge">宇宙固定視点</span>
      </div>
      <button id="viewToggleBtn1" class="btn btn-accent" onclick="toggleView1()">回転地面視点に切替</button>
      <div class="label-flex" style="margin-top:4px;">
        <span>自転速度</span>
        <span id="speedVal1" class="val-badge">1.0x</span>
      </div>
      <input type="range" id="rotSpeed1" min="0" max="2.5" step="0.1" value="1.0" oninput="updateSpeed(1)">
      <div class="btn-grid" style="margin-top:4px;">
        <button class="btn btn-primary" onclick="fireParticle1()">ボール発射</button>
        <button class="btn btn-secondary" onclick="clearPaths1()">軌跡クリア</button>
      </div>
    </div>

    <!-- モード2 コントロール -->
    <div id="ctrl-mode2" class="control-group" style="display:none;">
      <div class="label-flex">
        <span>実験地の緯度</span>
        <span id="latLabel2" class="val-badge">90° (北極)</span>
      </div>
      <input type="range" id="latSlider2" min="0" max="90" step="5" value="90" oninput="updatePendulumLat()">
      <div class="label-flex" style="margin-top:4px;">
        <span>時間経過速度</span>
        <span id="speedVal2" class="val-badge">1.0x</span>
      </div>
      <input type="range" id="speedSlider2" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updatePendulumSpeed()">
      <div class="btn-grid" style="margin-top:4px;">
        <button class="btn btn-primary" onclick="resetPendulum()">振り子リセット</button>
        <button class="btn btn-secondary" onclick="clearPendulumTrace()">軌跡クリア</button>
      </div>
    </div>

    <!-- モード3 コントロール -->
    <div id="ctrl-mode3" class="control-group" style="display:none;">
      <div class="label-flex">
        <span>地球自転速度</span>
        <span id="speedVal3" class="val-badge">1.0x (自転あり)</span>
      </div>
      <input type="range" id="rotSpeed3" min="0" max="2.5" step="0.1" value="1.0" oninput="updateSpeed(3)">
      <div class="btn-grid" style="margin-top:2px;">
        <button class="btn btn-accent" onclick="setZeroRotation3()">自転停止 (0.0x)</button>
        <button class="btn btn-primary" onclick="setNormalRotation3()">標準自転 (1.0x)</button>
      </div>

      <div class="label-flex" style="margin-top:4px;">
        <span>大気循環帯・風流線表示</span>
      </div>
      <button id="circToggleBtn3" class="btn btn-toggle" onclick="toggleCirculation3()">風系流線表示: ON</button>

      <div class="btn-grid" style="margin-top:4px;">
        <button class="btn btn-primary" onclick="fireAirParticle3()">空気塊発射 (正面赤道から)</button>
        <button class="btn btn-secondary" onclick="clearAirPaths3()">軌跡クリア</button>
      </div>
    </div>

    <!-- モード4 コントロール -->
    <div id="ctrl-mode4" class="control-group" style="display:none;">
      <div class="label-flex">
        <span>偏西風の強さ (風速)</span>
        <span id="jetSpeedVal4" class="val-badge">5 (中)</span>
      </div>
      <input type="range" id="jetSpeed4" min="1" max="10" step="1" value="5" oninput="updateJetSpeedVal4()">

      <div class="label-flex" style="margin-top:4px;">
        <span>偏西風 (ジェット気流) 蛇行振幅</span>
        <span id="meanderVal4" class="val-badge">35</span>
      </div>
      <input type="range" id="jetMeander4" min="0" max="80" step="5" value="35" oninput="updateMeanderVal4()">

      <div class="btn-grid-3" style="margin-top:4px;">
        <button class="btn btn-primary" onclick="spawnWeather4('L')">低気圧 [低]</button>
        <button class="btn btn-toggle" onclick="spawnWeather4('H')">高気圧 [高]</button>
        <button class="btn btn-pink" onclick="spawnWeather4('T')">台風発生 [台]</button>
      </div>
      <button class="btn btn-secondary" style="width:100%; margin-top:2px;" onclick="clearClouds4()">気圧配置クリア</button>
    </div>

  </div>
</div>

<script>
// --- グローバル状態管理 ---
let currentMode = 1;

// --- キャンバス参照 ---
const c2d = document.getElementById('canvas2d');
const ctx2d = c2d.getContext('2d');
const c3dContainer = document.getElementById('canvas3d');

// --- Three.js オブジェクト ---
let renderer, scene3d, camera3d, controls3d;
let pendulumGroup, globeGroup, windLinesGroup;

// --- 外部GeoJSONデータ管理 ---
let geojsonData = null;

// --- 初期化 ---
window.onload = () => {
  initThreeJS();
  resizeRenderer();
  loadExternalMap();
  setMode(1);
  animate();
};

// 画面サイズ変化時にレンダラー・カメラをコンテナサイズへ追従させる
function resizeRenderer() {
  const container = document.getElementById('canvasContainer');
  if (!renderer || !container) return;
  const w = container.clientWidth;
  const h = container.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  camera3d.aspect = w / h;
  camera3d.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);

// 外部GeoJSONマップデータ（Natural Earth 高精度ベクター）読み込み
function loadExternalMap() {
  fetch('https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_50m_land.geojson')
    .then(response => response.json())
    .then(data => {
      geojsonData = data;
      if (currentMode === 4) drawMode4();
    })
    .catch(err => {
      console.warn("外部マップの読み込みに失敗しました。フォールバックデータを使用します。", err);
    });
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i+1 === mode));
  
  document.getElementById('ctrl-mode1').style.display = (mode === 1) ? 'flex' : 'none';
  document.getElementById('ctrl-mode2').style.display = (mode === 2) ? 'flex' : 'none';
  document.getElementById('ctrl-mode3').style.display = (mode === 3) ? 'flex' : 'none';
  document.getElementById('ctrl-mode4').style.display = (mode === 4) ? 'flex' : 'none';

  const overlayTag = document.getElementById('overlayTag');
  const legendBox = document.getElementById('legendBox');
  
  if (mode === 1 || mode === 4) {
    c2d.style.display = 'block';
    c3dContainer.style.display = 'none';
  } else {
    c2d.style.display = 'none';
    c3dContainer.style.display = 'block';
  }

  // 凡例・オーバーレイ更新
  if (mode === 1) {
    overlayTag.innerText = "MODE 1: 的当て (回転盤)";
    legendBox.style.display = 'none';
  } else if (mode === 2) {
    overlayTag.innerText = "MODE 2: 長振り子 (フーコーの実験)";
    legendBox.style.display = 'flex';
    legendBox.innerHTML = `
      <div class="legend-item"><span class="legend-dot" style="background:#f43f5e;"></span>振動軌跡</div>
      <div class="legend-item"><span class="legend-dot" style="background:#10b981;"></span>床面ピン</div>
    `;
    setupPendulumScene();
  } else if (mode === 3) {
    overlayTag.innerText = "MODE 3: 3D立体地球 (自転有無と大気循環)";
    legendBox.style.display = 'flex';
    legendBox.innerHTML = `
      <div class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span>偏西風 (西風)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f43f5e;"></span>貿易風 (東風)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span>自転なし (南北直線)</div>
    `;
    setupGlobeScene();
  } else if (mode === 4) {
    overlayTag.innerText = "MODE 4: 日本周辺マップ ＆ 偏西風・台風連動";
    legendBox.style.display = 'flex';
    legendBox.innerHTML = `
      <div class="legend-item"><span class="legend-dot" style="background:#38bdf8;"></span>偏西風 (ジェット気流)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f43f5e;"></span>低気圧</div>
      <div class="legend-item"><span class="legend-dot" style="background:#facc15;"></span>高気圧</div>
      <div class="legend-item"><span class="legend-dot" style="background:#ec4899;"></span>台風 (進行方向変化)</div>
    `;
  }
}

// --- Three.js 初期化 ---
function initThreeJS() {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  const container = document.getElementById('canvasContainer');
  renderer.setSize(container.clientWidth || 580, container.clientHeight || 580);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  c3dContainer.appendChild(renderer.domElement);

  scene3d = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera3d.position.set(0, 0, 320);

  controls3d = new THREE.OrbitControls(camera3d, renderer.domElement);
  controls3d.enableDamping = true;
  controls3d.dampingFactor = 0.05;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
  scene3d.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(200, 200, 200);
  scene3d.add(dirLight);
}

// ==========================================
// モード1: 的当て (2D Canvas)
// ==========================================
let viewEarth1 = false;
let rotSpeed1 = 0.015;
let angle1 = 0;
let particles1 = [];

function toggleView1() {
  viewEarth1 = !viewEarth1;
  const btn = document.getElementById('viewToggleBtn1');
  const label = document.getElementById('viewLabel1');
  if (viewEarth1) {
    btn.innerText = "宇宙固定視点に切替";
    label.innerText = "回転地面視点";
    label.style.color = "#10b981";
  } else {
    btn.innerText = "回転地面視点に切替";
    label.innerText = "宇宙固定視点";
    label.style.color = "#c084fc";
  }
}

function updateSpeed(m) {
  if (m === 1) {
    const val = parseFloat(document.getElementById('rotSpeed1').value);
    rotSpeed1 = 0.015 * val;
    document.getElementById('speedVal1').innerText = val.toFixed(1) + 'x';
  } else if (m === 3) {
    const val = parseFloat(document.getElementById('rotSpeed3').value);
    rotSpeed3Val = val;
    rotSpeed3 = 0.01 * val;
    const label = document.getElementById('speedVal3');
    if (val === 0) {
      label.innerText = "0.0x (自転なし)";
      label.style.color = "#38bdf8";
    } else {
      label.innerText = val.toFixed(1) + "x (自転あり)";
      label.style.color = "#f59e0b";
    }
    updateGlobeWindOverlay();
  }
}

function fireParticle1() {
  particles1.push({
    x: 0, y: 0, vx: 0, vy: -2.8,
    pathSpace: [{x:0, y:0}], pathEarth: [{x:0, y:0}]
  });
}
function clearPaths1() { particles1 = []; }

function drawMode1() {
  const cx = 290, cy = 290;
  angle1 += rotSpeed1;
  ctx2d.save();
  ctx2d.translate(cx, cy);

  let diskAngle = viewEarth1 ? 0 : angle1;

  ctx2d.save();
  ctx2d.rotate(diskAngle);
  
  ctx2d.beginPath(); ctx2d.arc(0, 0, 220, 0, Math.PI * 2);
  ctx2d.fillStyle = '#0f172a'; ctx2d.fill();
  ctx2d.strokeStyle = '#38bdf8'; ctx2d.lineWidth = 2; ctx2d.stroke();

  for (let i = 0; i < 12; i++) {
    ctx2d.beginPath(); ctx2d.moveTo(0, 0);
    ctx2d.lineTo(220 * Math.cos(i * Math.PI / 6), 220 * Math.sin(i * Math.PI / 6));
    ctx2d.strokeStyle = (i % 3 === 0) ? '#334155' : '#1e293b'; ctx2d.stroke();
  }

  // ターゲット (的)
  ctx2d.fillStyle = '#f43f5e'; ctx2d.beginPath(); ctx2d.arc(0, -180, 16, 0, Math.PI * 2); ctx2d.fill();
  ctx2d.fillStyle = '#ffffff'; ctx2d.beginPath(); ctx2d.arc(0, -180, 10, 0, Math.PI * 2); ctx2d.fill();
  ctx2d.fillStyle = '#f43f5e'; ctx2d.beginPath(); ctx2d.arc(0, -180, 4, 0, Math.PI * 2); ctx2d.fill();

  ctx2d.fillStyle = '#f59e0b'; ctx2d.beginPath(); ctx2d.arc(0, 0, 8, 0, Math.PI * 2); ctx2d.fill();
  ctx2d.restore();

  particles1.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    const cosA = Math.cos(-angle1), sinA = Math.sin(-angle1);
    const ex = p.x * cosA - p.y * sinA;
    const ey = p.x * sinA + p.y * cosA;

    p.pathSpace.push({x: p.x, y: p.y});
    p.pathEarth.push({x: ex, y: ey});

    const activePath = viewEarth1 ? p.pathEarth : p.pathSpace;

    ctx2d.beginPath();
    ctx2d.strokeStyle = viewEarth1 ? '#10b981' : '#c084fc'; ctx2d.lineWidth = 3;
    activePath.forEach((pt, i) => { if (i === 0) ctx2d.moveTo(pt.x, pt.y); else ctx2d.lineTo(pt.x, pt.y); });
    ctx2d.stroke();

    const head = activePath[activePath.length - 1];
    ctx2d.fillStyle = '#facc15'; ctx2d.beginPath(); ctx2d.arc(head.x, head.y, 6, 0, Math.PI * 2); ctx2d.fill();
  });

  ctx2d.restore();
}

// モード2: 長振り子（フーコーの実験 3D）
// ==========================================
let pendulumLat = 90;
let pendulumSpeed = 1.0;
let pendulumAngle = 0;
let pendulumTime = 0;
let pendulumTraceLines = [];
let pins = [];

function setupPendulumScene() {
  while(scene3d.children.length > 0) scene3d.remove(scene3d.children[0]);
  scene3d.add(new THREE.AmbientLight(0xffffff, 0.8));
  
  camera3d.position.set(0, 160, 240);
  controls3d.target.set(0, 0, 0);

  pendulumGroup = new THREE.Group();

  const floorGeo = new THREE.CylinderGeometry(100, 100, 2, 64);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.y = -80;
  pendulumGroup.add(floor);

  const ringGeo = new THREE.RingGeometry(85, 87, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -78.9;
  pendulumGroup.add(ring);

  pins = [];
  for (let i = 0; i < 24; i++) {
    const ang = (i / 24) * Math.PI * 2;
    const pinGeo = new THREE.CylinderGeometry(1.2, 1.2, 12, 16);
    const pinMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
    const pin = new THREE.Mesh(pinGeo, pinMat);
    pin.position.set(Math.cos(ang) * 75, -73, Math.sin(ang) * 75);
    pendulumGroup.add(pin);
    pins.push({ mesh: pin, angle: ang, knocked: false });
  }

  const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff });
  const wireGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 120, 0), new THREE.Vector3(0, -70, 0)]);
  const wire = new THREE.Line(wireGeo, wireMat);
  wire.name = "wire";
  pendulumGroup.add(wire);

  const ballGeo = new THREE.SphereGeometry(7, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.5, roughness: 0.2 });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.name = "ball";
  ball.position.set(0, -70, 0);
  pendulumGroup.add(ball);

  scene3d.add(pendulumGroup);
  clearPendulumTrace();
}

function updatePendulumLat() {
  pendulumLat = parseFloat(document.getElementById('latSlider2').value);
  document.getElementById('latLabel2').innerText = pendulumLat + '°';
}
function updatePendulumSpeed() {
  pendulumSpeed = parseFloat(document.getElementById('speedSlider2').value);
  document.getElementById('speedVal2').innerText = pendulumSpeed.toFixed(1) + 'x';
}
function resetPendulum() {
  pendulumTime = 0;
  pendulumAngle = 0;
  clearPendulumTrace();
  pins.forEach(p => { p.knocked = false; p.mesh.rotation.z = 0; p.mesh.position.y = -73; });
}
function clearPendulumTrace() {
  pendulumTraceLines.forEach(l => scene3d.remove(l));
  pendulumTraceLines = [];
}

function updatePendulum() {
  if (currentMode !== 2 || !pendulumGroup) return;

  pendulumTime += 0.04 * pendulumSpeed;
  const omega = 0.003 * Math.sin(pendulumLat * Math.PI / 180) * pendulumSpeed;
  pendulumAngle += omega;

  const amp = 70;
  const swing = Math.sin(pendulumTime) * amp;

  const x = Math.cos(pendulumAngle) * swing;
  const z = Math.sin(pendulumAngle) * swing;

  const ball = pendulumGroup.getObjectByName("ball");
  const wire = pendulumGroup.getObjectByName("wire");

  if (ball && wire) {
    ball.position.set(x, -70 + Math.abs(Math.sin(pendulumTime)) * 3, z);
    const positions = wire.geometry.attributes.position.array;
    positions[3] = ball.position.x;
    positions[4] = ball.position.y;
    positions[5] = ball.position.z;
    wire.geometry.attributes.position.needsUpdate = true;

    if (Math.abs(swing) > 5) {
      const dotGeo = new THREE.SphereGeometry(0.8, 8, 8);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.set(x, -78, z);
      scene3d.add(dot);
      pendulumTraceLines.push(dot);
      if (pendulumTraceLines.length > 300) {
        scene3d.remove(pendulumTraceLines.shift());
      }
    }

    pins.forEach(p => {
      if (!p.knocked && Math.hypot(p.mesh.position.x - x, p.mesh.position.z - z) < 8) {
        p.knocked = true;
        p.mesh.rotation.z = Math.PI / 2;
        p.mesh.position.y = -77;
      }
    });
  }
}

let rotSpeed3 = 0.01;

function setupGlobeScene() {

function setZeroRotation3() {

  updateSpeed(3);
}
function setNormalRotation3() {
  document.getElementById('rotSpeed3').value = 1.0;
  updateSpeed(3);
}

function toggleCirculation3() {
  showCirculation3 = !showCirculation3;
  const btn = document.getElementById('circToggleBtn3');
  btn.innerText = "風系流線表示: " + (showCirculation3 ? "ON" : "OFF");
  btn.className = showCirculation3 ? "btn btn-toggle" : "btn btn-toggle off";
  if (windLinesGroup) windLinesGroup.visible = showCirculation3;
}

function updateGlobeWindOverlay() {
  if (!windLinesGroup) return;
  while(windLinesGroup.children.length > 0) windLinesGroup.remove(windLinesGroup.children[0]);

  const r = 103;

  if (rotSpeed3Val === 0) {
    // 【自転なし】南北直線風
    for (let lon = 0; lon < 360; lon += 30) {
      const points = [];
      for (let lat = -80; lat <= 80; lat += 5) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);
        points.push(new THREE.Vector3(
          -(r * Math.sin(phi) * Math.cos(theta)),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        ));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineDashedMaterial({ color: 0x38bdf8, dashSize: 4, gapSize: 3 });
      const line = new THREE.Line(geo, mat);
      line.computeLineDistances();
      windLinesGroup.add(line);
    }
  } else {
    // 【自転あり】偏西風・貿易風帯
    [45, -45].forEach(baseLat => {
      const westerliesGeo = new THREE.TorusGeometry(r * Math.cos(baseLat * Math.PI / 180), 1.8, 16, 100);
      const westerliesMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.7 });
      const ring = new THREE.Mesh(westerliesGeo, westerliesMat);
      ring.position.y = r * Math.sin(baseLat * Math.PI / 180);
      ring.rotation.x = Math.PI / 2;
      windLinesGroup.add(ring);
    });

    [15, -15].forEach(baseLat => {
      const tradesGeo = new THREE.TorusGeometry(r * Math.cos(baseLat * Math.PI / 180), 1.8, 16, 100);
      const tradesMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.6 });
      const ring = new THREE.Mesh(tradesGeo, tradesMat);
      ring.position.y = r * Math.sin(baseLat * Math.PI / 180);
      ring.rotation.x = Math.PI / 2;
      windLinesGroup.add(ring);
    });
  }
}

// 修正：空気塊の発射場所が必ず「正面（カメラ手前）」になるよう動的計算
function fireAirParticle3() {
  if (!globeGroup) return;

  // カメラの位置から地球正面の方位角（経度）を算出
  const camPos = camera3d.position;
  const camAngle = Math.atan2(camPos.x, camPos.z);

  // 地球オブジェクトの現在の自転角度
  const earth = globeGroup.getObjectByName("earthMesh");
  const earthRot = earth ? earth.rotation.y : 0;

  // 地球のローカル座標系においてカメラ正面を指す経度(度)
  let centerLonDeg = (camAngle - earthRot) * (180 / Math.PI);
  centerLonDeg = ((centerLonDeg + 180) % 360 + 360) % 360 - 180;

  const pGeo = new THREE.SphereGeometry(3.5, 16, 16);
  const pMat = new THREE.MeshBasicMaterial({ color: rotSpeed3Val === 0 ? 0x38bdf8 : 0xfacc15 });
  const pMesh = new THREE.Mesh(pGeo, pMat);
  
  scene3d.add(pMesh);
  airParticles3.push({
    mesh: pMesh,
    lat: 0,
    lon: centerLonDeg, // 必ず画面正面の経度から発射
    vLat: 0.5
  });
}

function clearAirPaths3() {
  airParticles3.forEach(p => scene3d.remove(p.mesh));
  airParticles3 = [];
}

function updateGlobe() {
  if (currentMode !== 3 || !globeGroup) return;

  const earth = globeGroup.getObjectByName("earthMesh");
  if (earth) earth.rotation.y += rotSpeed3;

  const r = 105;
  airParticles3.forEach(p => {
    p.lat += p.vLat;
    if (rotSpeed3Val > 0) {
      p.lon += Math.sin(p.lat * Math.PI / 180) * rotSpeed3Val * 1.8;
    }

    if (p.lat <= 85) {
      const phi = (90 - p.lat) * (Math.PI / 180);
      const theta = (p.lon + 180) * (Math.PI / 180);

      p.mesh.position.x = -(r * Math.sin(phi) * Math.cos(theta));
      p.mesh.position.z = (r * Math.sin(phi) * Math.sin(theta));
      p.mesh.position.y = (r * Math.cos(phi));
    }
  });
}

// モード4: 日本周辺マップ ＆ 偏西風・台風連動

let weatherSystems4 = [];
let jetOffset4 = 0;

function updateJetSpeedVal4() {

function spawnWeather4(type) {

function clearClouds4() { weatherSystems4 = []; }

// 緯度経度 -> キャンバス座標変換 (日本中心)
function latLonToCanvas(lat, lon) {
  const x = 290 + (lon - 137.5) * 16.5;
  const y = 290 - (lat - 36.5) * 19.0;
  return { x, y };
}

// フォールバック用簡易マップデータ
const mapPathsFallback = {
  honshu: [[41.5,141.5],[39.0,142.0],[37.0,140.8],[35.8,140.0],[35.3,139.8],[34.6,138.7],[34.7,136.9],[34.2,135.2],[34.3,133.0],[33.9,130.9],[34.6,132.5],[35.6,134.5],[36.0,136.0],[36.7,137.2],[37.9,139.0],[40.0,140.0],[41.2,140.6]],
  hokkaido: [[41.4,140.0],[42.0,140.8],[42.0,142.0],[42.9,143.3],[43.4,145.8],[44.0,144.3],[45.4,141.8],[43.2,141.2],[42.3,139.8]],
  kyushu: [[33.9,130.2],[33.9,131.0],[33.1,131.9],[31.4,131.4],[31.0,130.7],[32.0,130.2],[32.8,129.8]],
  shikoku: [[34.4,134.3],[33.8,134.7],[33.5,134.3],[32.7,133.0],[33.3,132.1],[34.1,133.5]]
};

function drawMode4() {
  ctx2d.clearRect(0, 0, 580, 580);
  
  const jetSpeedVal = parseFloat(document.getElementById('jetSpeed4')?.value || 5);
  jetOffset4 += 0.015 * jetSpeedVal;

  const meanderAmp = parseFloat(document.getElementById('jetMeander4')?.value || 35);

  // 海洋背景
  ctx2d.fillStyle = '#060d1b';
  ctx2d.fillRect(0, 0, 580, 580);

  // 1. 緯度経度グリッド描画
  ctx2d.strokeStyle = 'rgba(56, 189, 248, 0.12)';
  ctx2d.lineWidth = 1;
  ctx2d.setLineDash([4, 4]);
  ctx2d.font = '10px monospace';
  ctx2d.fillStyle = 'rgba(148, 163, 184, 0.5)';

  for (let lat = 20; lat <= 50; lat += 5) {
    const p = latLonToCanvas(lat, 137.5);
    ctx2d.beginPath(); ctx2d.moveTo(0, p.y); ctx2d.lineTo(580, p.y); ctx2d.stroke();
    ctx2d.fillText(lat + 'N', 10, p.y - 4);
  }
  for (let lon = 120; lon <= 150; lon += 10) {
    const p = latLonToCanvas(36.5, lon);
    ctx2d.beginPath(); ctx2d.moveTo(p.x, 0); ctx2d.lineTo(p.x, 580); ctx2d.stroke();
    ctx2d.fillText(lon + 'E', p.x + 4, 570);
  }
  ctx2d.setLineDash([]);

  // 2. 外部ネットワーク(GeoJSON)を用いた地図表示
  ctx2d.fillStyle = 'rgba(30, 41, 59, 0.85)';
  ctx2d.strokeStyle = 'rgba(56, 189, 248, 0.5)';
  ctx2d.lineWidth = 1.2;

  if (geojsonData && geojsonData.features) {
    // 外部GeoJSONデータによる正確な地図描画
    geojsonData.features.forEach(feature => {
      const geom = feature.geometry;
      if (!geom) return;

      const renderPoly = (coords) => {
        coords.forEach(ring => {
          ctx2d.beginPath();
          let drawn = false;
          ring.forEach(pt => {
            const lon = pt[0], lat = pt[1];
            if (lon >= 105 && lon <= 165 && lat >= 15 && lat <= 60) {
              const pos = latLonToCanvas(lat, lon);
              if (!drawn) { ctx2d.moveTo(pos.x, pos.y); drawn = true; }
              else { ctx2d.lineTo(pos.x, pos.y); }
            }
          });
          if (drawn) { ctx2d.closePath(); ctx2d.fill(); ctx2d.stroke(); }
        });
      };

      if (geom.type === 'Polygon') renderPoly(geom.coordinates);
      else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(poly => renderPoly(poly));
    });
  } else {
    // 地図データ取得前のフォールバック描画
    Object.values(mapPathsFallback).forEach(path => {
      ctx2d.beginPath();
      path.forEach((pt, i) => {
        const pos = latLonToCanvas(pt[0], pt[1]);
        if (i === 0) ctx2d.moveTo(pos.x, pos.y); else ctx2d.lineTo(pos.x, pos.y);
      });
      ctx2d.closePath(); ctx2d.fill(); ctx2d.stroke();
    });
  }

  // 地名ラベル
  ctx2d.fillStyle = 'rgba(241, 245, 249, 0.4)';
  ctx2d.font = '11px sans-serif';
  const labelHonshu = latLonToCanvas(36.0, 138.0);
  ctx2d.fillText("JAPAN", labelHonshu.x - 18, labelHonshu.y);

  // 3. 偏西風（ジェット気流）流線の描画
  for (let lane = -16; lane <= 16; lane += 16) {
    ctx2d.strokeStyle = lane === 0 ? 'rgba(56, 189, 248, 0.95)' : 'rgba(56, 189, 248, 0.35)';
    ctx2d.lineWidth = lane === 0 ? 4 : 1.5;
    if (lane !== 0) ctx2d.setLineDash([6, 6]); else ctx2d.setLineDash([]);
    ctx2d.beginPath();

    for (let x = 0; x <= 580; x += 8) {
      let y = 260 + lane + Math.sin(x * 0.01 + jetOffset4) * meanderAmp;
      if (x === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
    }
    ctx2d.stroke();
    ctx2d.setLineDash([]);
  }

  // 4. 風流粒子（移動粒子）
  ctx2d.fillStyle = '#38bdf8';
  for (let x = (jetOffset4 * 35) % 90; x < 580; x += 90) {
    let y = 260 + Math.sin(x * 0.01 + jetOffset4) * meanderAmp;
    ctx2d.beginPath(); ctx2d.arc(x, y, 3.5, 0, Math.PI * 2); ctx2d.fill();
  }

  // 5. 天気システム (高気圧・低気圧・台風の連動移動)
  weatherSystems4.forEach(ws => {
    if (ws.type === 'T') {
      // 台風の物理シミュレーション（偏西風の強さとの連動）
      ws.path.push({x: ws.x, y: ws.y});
      if (ws.path.length > 90) ws.path.shift();

      // 北上して偏西風帯(y < 370 付近)に入ると、偏西風の強さに比例して東向き(vx)に強い力を受けて加速・転向する
      if (ws.y < 370) {
        const influence = (370 - ws.y) / 370;
        ws.vx += 0.025 * (jetSpeedVal * 0.35) * (1 + influence); // 偏西風による東進加速
        ws.vy -= 0.003 * jetSpeedVal; // 東へ流されながらの移動
      } else {
        // 南海上では太平洋高気圧の縁を北〜北西に進む
        ws.vx += -0.003;
      }

      ws.x += ws.vx;
      ws.y += ws.vy;

      // 台風の進行軌跡の描画
      ctx2d.strokeStyle = 'rgba(236, 72, 153, 0.7)';
      ctx2d.lineWidth = 2.5;
      ctx2d.beginPath();
      ws.path.forEach((pt, i) => {
        if (i === 0) ctx2d.moveTo(pt.x, pt.y);
        else ctx2d.lineTo(pt.x, pt.y);
      });
      ctx2d.stroke();

      // 台風本体の描画
      const waveOffset = Math.sin(ws.x * 0.01 + jetOffset4) * (meanderAmp * 0.1);
      ctx2d.fillStyle = 'rgba(236, 72, 153, 0.9)';
      ctx2d.beginPath(); ctx2d.arc(ws.x, ws.y + waveOffset, ws.size, 0, Math.PI * 2); ctx2d.fill();
      ctx2d.strokeStyle = '#ffffff'; ctx2d.lineWidth = 2; ctx2d.stroke();

      // 渦巻きマーク線
      ctx2d.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx2d.lineWidth = 1.5;
      ctx2d.beginPath();
      ctx2d.arc(ws.x, ws.y + waveOffset, ws.size * 0.5, jetOffset4 * 2, jetOffset4 * 2 + Math.PI * 1.2);
      ctx2d.stroke();

      ctx2d.fillStyle = '#ffffff'; ctx2d.font = 'bold 12px sans-serif';
      ctx2d.fillText('台', ws.x - 6, ws.y + waveOffset + 4);

    } else {
      // 低気圧・高気圧の移動
      ws.x += 0.3 * jetSpeedVal;
      ws.y = 260 + Math.sin(ws.x * 0.01 + jetOffset4) * meanderAmp;

      if (ws.type === 'L') {
        ctx2d.fillStyle = 'rgba(244, 63, 94, 0.85)';
        ctx2d.beginPath(); ctx2d.arc(ws.x, ws.y, ws.size, 0, Math.PI * 2); ctx2d.fill();
        ctx2d.strokeStyle = '#ffffff'; ctx2d.lineWidth = 1.5; ctx2d.stroke();
        ctx2d.fillStyle = '#ffffff'; ctx2d.font = 'bold 13px sans-serif';
        ctx2d.fillText('低', ws.x - 6, ws.y + 5);
      } else {
        ctx2d.fillStyle = 'rgba(250, 204, 21, 0.85)';
        ctx2d.beginPath(); ctx2d.arc(ws.x, ws.y, ws.size * 1.1, 0, Math.PI * 2); ctx2d.fill();
        ctx2d.strokeStyle = '#020617'; ctx2d.lineWidth = 1.5; ctx2d.stroke();
        ctx2d.fillStyle = '#020617'; ctx2d.font = 'bold 13px sans-serif';
        ctx2d.fillText('高', ws.x - 6, ws.y + 5);
      }
    }
  });
}

// ==========================================
// メインアニメーションループ
// ==========================================
function animate() {
  requestAnimationFrame(animate);

  if (currentMode === 1) {
    ctx2d.clearRect(0, 0, 580, 580);
    drawMode1();
  } else if (currentMode === 2) {
    updatePendulum();
    controls3d.update();
    renderer.render(scene3d, camera3d);
  } else if (currentMode === 3) {
    updateGlobe();
    controls3d.update();
    renderer.render(scene3d, camera3d);
  } else if (currentMode === 4) {
    drawMode4();
  }
}
</script>
