<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>モノコードシミュレーター</title>
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .layout{grid-template-columns:1.6fr 1fr;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}

  .canvas-container{position:relative;}
  .canvas-container + .canvas-container{margin-top:14px;}
  .canvas-container canvas{display:block;width:100%;height:100%;touch-action:manipulation;}
  #monochordCanvas{height:100%;}
  .stage.mono{height:260px;}
  .stage.wave{height:230px;}

  /* キャンバスの役割を示す小さな見出し */
  .stage .caption{
    position:absolute;top:10px;left:12px;z-index:2;
    font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--text-faint);pointer-events:none;
  }

  /* 3段階スライダーの目盛り */
  .control .ticks{
    display:flex;justify-content:space-between;
    font-family:var(--font-mono);font-size:10px;color:var(--text-faint);
    margin-top:-2px;
  }
  .control-group{display:flex;flex-direction:column;gap:9px;}

  @media (max-width:600px){
    .stage.mono{height:220px;}
    .stage.wave{height:190px;}
  }
</style>
</head>
<body class="instrument">

<div class="topbar">
  <a class="back" href="index.html">← ホームへ</a>
  <span class="unit-title">09 ／ モノコードと音の性質</span>
</div>

<div class="sim-header">
  <span class="eyebrow">Monochord · Pitch and Loudness</span>
  <h1>モノコードシミュレーター</h1>
  <p>弦の条件を変えて「弦をはじく」と、音の高さと大きさがどう変わるかを、波形と音で同時に確かめられます。</p>
</div>

<div class="layout">

  <div class="panel flush">
    <div class="canvas-container stage mono">
      <span class="caption">Monochord</span>
      <canvas id="monochordCanvas"></canvas>
    </div>

    <div class="canvas-container stage wave">
      <span class="caption">Waveform</span>
      <canvas id="waveCanvas"></canvas>
    </div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>弦の条件</h2>

    <div class="controls">
      <!-- はじく強さ -->
      <div class="control control-group amplitude">
        <label for="pluckSlider">はじく強さ<span class="val" id="pluckVal">中</span></label>
        <input type="range" id="pluckSlider" min="1" max="3" step="1" value="2">
        <div class="ticks"><span>弱</span><span>中</span><span>強</span></div>
      </div>

      <!-- 弦の長さ -->
      <div class="control control-group frequency">
        <label for="lengthSlider">弦の長さ<span class="val" id="lengthVal">中</span></label>
        <input type="range" id="lengthSlider" min="1" max="3" step="1" value="2">
        <div class="ticks"><span>長</span><span>中</span><span>短</span></div>
      </div>

      <!-- 弦を張る力 -->
      <div class="control control-group frequency">
        <label for="tensionSlider">弦を張る力<span class="val" id="tensionVal">中</span></label>
        <input type="range" id="tensionSlider" min="1" max="3" step="1" value="2">
        <div class="ticks"><span>弱</span><span>中</span><span>強</span></div>
      </div>

      <!-- 弦の太さ -->
      <div class="control control-group frequency">
        <label for="thicknessSlider">弦の太さ<span class="val" id="thicknessVal">中</span></label>
        <input type="range" id="thicknessSlider" min="1" max="3" step="1" value="2">
        <div class="ticks"><span>細</span><span>中</span><span>太</span></div>
      </div>
    </div>

    <hr class="divider">

    <div class="btnrow">
      <button class="btn primary" id="pluckBtn" style="flex:1">弦をはじく</button>
    </div>
  </div>

</div>

<script>
    // Canvas & Context Setup
    const monochordCanvas = document.getElementById('monochordCanvas');
    const waveCanvas = document.getElementById('waveCanvas');
    const ctxM = monochordCanvas.getContext('2d');
    const ctxW = waveCanvas.getContext('2d');

    // 描画色はテーマトークンから読み出す
    const _cs = getComputedStyle(document.body);
    const tok = (n, f) => (_cs.getPropertyValue(n).trim() || f);
    const C_TRACE = tok('--accent', '#2fd6c3');   // 波形
    const C_AMP   = tok('--force',  '#ff6b5a');   // 振幅（音の大きさ）
    const C_WAVE  = tok('--normal', '#4ade80');   // 波長（音の高さ）
    const C_DIMLN = tok('--border-strong', '#3a4757');

    // UI Elements
    const pluckSlider = document.getElementById('pluckSlider');
    const lengthSlider = document.getElementById('lengthSlider');
    const tensionSlider = document.getElementById('tensionSlider');
    const thicknessSlider = document.getElementById('thicknessSlider');
    const pluckBtn = document.getElementById('pluckBtn');

    // Audio Context Setup
    let audioCtx = null;
    let currentOsc = null;
    let previewOsc = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Canvas Resizing
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        monochordCanvas.width = monochordCanvas.parentElement.clientWidth * dpr;
        monochordCanvas.height = monochordCanvas.parentElement.clientHeight * dpr;
        waveCanvas.width = waveCanvas.parentElement.clientWidth * dpr;
        waveCanvas.height = waveCanvas.parentElement.clientHeight * dpr;
        ctxM.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctxW.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // State Variables
    let isVibrating = false;
    let startTime = 0;
    let currentAmplitude = 0; 
    let currentFreq = 220;    

    // 中学1年理科の学習用語に合わせた表示定義
    const textMaps = {
        pluck: { 1: "弱", 2: "中", 3: "強" },
        length: { 1: "長", 2: "中", 3: "短" },
        tension: { 1: "弱", 2: "中", 3: "強" },
        thickness: { 1: "細", 2: "中", 3: "太" }
    };

    function updateLabels() {
        document.getElementById('pluckVal').textContent = textMaps.pluck[pluckSlider.value];
        document.getElementById('lengthVal').textContent = textMaps.length[lengthSlider.value];
        document.getElementById('tensionVal').textContent = textMaps.tension[tensionSlider.value];
        document.getElementById('thicknessVal').textContent = textMaps.thickness[thicknessSlider.value];
    }

    // 物理パラメータ計算
    function calculatePhysics() {
        let baseFreq = 220; // 基準振動数 (A3)

        // 弦の長さ：短いほど高音
        const lengthFactor = [1.0, 1.33, 2.0][lengthSlider.value - 1];

        // 弦を張る力（おもりの数）：強いほど高音
        const tensionFactor = [0.8, 1.0, 1.25][tensionSlider.value - 1];

        // 弦の太さ：細いほど高音
        const thicknessFactor = [1.2, 1.0, 0.8][thicknessSlider.value - 1];

        const freq = baseFreq * lengthFactor * tensionFactor * thicknessFactor;
        const ampBase = [25, 50, 75][pluckSlider.value - 1];

        return { freq, ampBase };
    }

    // メーター変更時のプレビュー音（短音）再生
    function playPreviewSound() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const { freq, ampBase } = calculatePhysics();

        if (previewOsc) {
            try { previewOsc.stop(); } catch(e) {}
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        // プレビュー用に控えめの音量で短く再生
        const volume = (ampBase / 75) * 0.15;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);

        previewOsc = osc;
    }

    // スライダー操作イベントの登録
    [pluckSlider, lengthSlider, tensionSlider, thicknessSlider].forEach(slider => {
        slider.addEventListener('input', () => {
            updateLabels();
            playPreviewSound();
        });
    });
    updateLabels();

    // 本再生（弦をはじく）
    function pluck() {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const { freq, ampBase } = calculatePhysics();
        currentFreq = freq;

        if (currentOsc) {
            try { currentOsc.stop(); } catch(e) {}
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        const volume = (ampBase / 75) * 0.35;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.5);

        currentOsc = osc;

        isVibrating = true;
        startTime = performance.now();
    }

    pluckBtn.addEventListener('click', pluck);

    // モノコード描画
    function drawMonochord(now) {
        const w = monochordCanvas.clientWidth;
        const h = monochordCanvas.clientHeight;
        ctxM.clearRect(0, 0, w, h);

        const marginX = 60;
        const bridgeY = h * 0.55;

        // 木の台（木口の陰影をつける）
        const boardX = marginX - 20, boardW = w - (marginX * 2) + 40;
        const woodGrad = ctxM.createLinearGradient(0, bridgeY + 10, 0, bridgeY + 35);
        woodGrad.addColorStop(0, '#8a5628');
        woodGrad.addColorStop(1, '#5e3717');
        ctxM.fillStyle = woodGrad;
        ctxM.fillRect(boardX, bridgeY + 10, boardW, 25);
        ctxM.fillStyle = '#3d2310';
        ctxM.fillRect(boardX, bridgeY + 35, boardW, 5);
        // 天板のハイライト
        ctxM.fillStyle = 'rgba(255,255,255,.14)';
        ctxM.fillRect(boardX, bridgeY + 10, boardW, 2);

        // 左端の固定具
        const nutGrad = ctxM.createLinearGradient(marginX - 15, 0, marginX - 5, 0);
        nutGrad.addColorStop(0, '#c3ccd8');
        nutGrad.addColorStop(1, '#6d7787');
        ctxM.fillStyle = nutGrad;
        ctxM.fillRect(marginX - 15, bridgeY - 15, 10, 30);

        // 右端の滑車
        const pulleyX = w - marginX;
        ctxM.beginPath();
        ctxM.arc(pulleyX, bridgeY + 5, 12, 0, Math.PI * 2);
        const pulGrad = ctxM.createLinearGradient(pulleyX - 12, bridgeY - 7, pulleyX + 12, bridgeY + 17);
        pulGrad.addColorStop(0, '#d5dce6');
        pulGrad.addColorStop(1, '#7d8798');
        ctxM.fillStyle = pulGrad;
        ctxM.fill();
        ctxM.strokeStyle = '#5b6575';
        ctxM.lineWidth = 1.5;
        ctxM.stroke();
        ctxM.beginPath();
        ctxM.arc(pulleyX, bridgeY + 5, 3.5, 0, Math.PI * 2);
        ctxM.fillStyle = '#3a4757';
        ctxM.fill();

        // 駒（ことじ）の位置
        const lengthVal = parseInt(lengthSlider.value);
        const bridgeRatio = [0.8, 0.6, 0.4][lengthVal - 1];
        const activeBridgeX = marginX + (pulleyX - marginX) * bridgeRatio;

        ctxM.beginPath();
        ctxM.moveTo(activeBridgeX - 12, bridgeY + 10);
        ctxM.lineTo(activeBridgeX + 12, bridgeY + 10);
        ctxM.lineTo(activeBridgeX, bridgeY - 15);
        ctxM.closePath();
        ctxM.fillStyle = '#f0c96a';
        ctxM.fill();
        ctxM.strokeStyle = '#a97d15';
        ctxM.lineWidth = 1.5;
        ctxM.stroke();

        // おもり
        const tensionVal = parseInt(tensionSlider.value);
        const weightY = bridgeY + 50;
        ctxM.beginPath();
        ctxM.moveTo(pulleyX + 5, bridgeY + 5);
        ctxM.lineTo(pulleyX + 5, weightY);
        ctxM.strokeStyle = '#9aa8ba';
        ctxM.lineWidth = 1.5;
        ctxM.stroke();

        // おもり（重ねるほど張力が強い）
        for (let i = 0; i < tensionVal; i++) {
            const wy = weightY + (i * 14);
            const wg = ctxM.createLinearGradient(0, wy, 0, wy + 12);
            wg.addColorStop(0, '#7fa8e8');
            wg.addColorStop(1, '#3f6bb5');
            ctxM.fillStyle = wg;
            ctxM.fillRect(pulleyX - 10, wy, 30, 12);
            ctxM.strokeStyle = '#2b4a80';
            ctxM.lineWidth = 1;
            ctxM.strokeRect(pulleyX - 9.5, wy + .5, 29, 11);
        }

        // 弦の振動計算
        let vibrOffset = 0;
        const { ampBase } = calculatePhysics();
        if (isVibrating) {
            const elapsed = (now - startTime) / 1000;
            const duration = 1.5;
            if (elapsed < duration) {
                const decay = Math.exp(-elapsed * 3);
                currentAmplitude = ampBase * decay;
                vibrOffset = Math.sin(elapsed * currentFreq * 0.1) * currentAmplitude * 0.3;
            } else {
                isVibrating = false;
                currentAmplitude = 0;
            }
        }

        // 弦の太さ
        const thicknessVal = parseInt(thicknessSlider.value);
        const stringLineWidth = [2, 4, 7][thicknessVal - 1];

        // 弦（非振動部分）— 駒の左側は鳴らないので落ち着いた色にする
        ctxM.save();
        ctxM.lineCap = 'round';
        ctxM.beginPath();
        ctxM.moveTo(marginX - 10, bridgeY - 10);
        ctxM.lineTo(activeBridgeX, bridgeY - 15);
        ctxM.strokeStyle = '#a2724f';
        ctxM.lineWidth = stringLineWidth;
        ctxM.stroke();

        // 弦（振動部分）— 鳴っている間は淡い光をまとわせる
        const midX = (activeBridgeX + pulleyX) / 2;
        if (isVibrating) {
            ctxM.shadowColor = C_AMP;
            ctxM.shadowBlur = 14;
        }
        ctxM.beginPath();
        ctxM.moveTo(activeBridgeX, bridgeY - 15);
        ctxM.quadraticCurveTo(midX, (bridgeY - 15) + vibrOffset, pulleyX, bridgeY - 10);
        ctxM.strokeStyle = isVibrating ? C_AMP : '#e8a04a';
        ctxM.lineWidth = stringLineWidth;
        ctxM.stroke();
        ctxM.restore();

        // 振動する長さのガイド表示
        ctxM.save();
        ctxM.beginPath();
        ctxM.moveTo(activeBridgeX, bridgeY - 30);
        ctxM.lineTo(pulleyX, bridgeY - 30);
        ctxM.strokeStyle = C_WAVE;
        ctxM.lineWidth = 2;
        ctxM.stroke();
        ctxM.fillStyle = C_WAVE;
        ctxM.fillRect(activeBridgeX, bridgeY - 35, 2, 10);
        ctxM.fillRect(pulleyX, bridgeY - 35, 2, 10);
        ctxM.font = '500 10px "JetBrains Mono", monospace';
        ctxM.textAlign = 'center';
        ctxM.textBaseline = 'bottom';
        ctxM.fillText('振動する長さ', (activeBridgeX + pulleyX) / 2, bridgeY - 38);
        ctxM.restore();
    }

    // 波形描画（オシロスコープ）
    function drawWave(now) {
        const w = waveCanvas.clientWidth;
        const h = waveCanvas.clientHeight;
        const centerY = h / 2;
        ctxW.clearRect(0, 0, w, h);

        // 方眼線の描画
        ctxW.strokeStyle = 'rgba(47,214,195,.10)';
        ctxW.lineWidth = 1;
        ctxW.beginPath();
        for (let y = 0; y < h; y += 25) {
            ctxW.moveTo(0, y + .5); ctxW.lineTo(w, y + .5);
        }
        for (let x = 0; x < w; x += 40) {
            ctxW.moveTo(x + .5, 0); ctxW.lineTo(x + .5, h);
        }
        ctxW.stroke();

        // センター軸
        ctxW.strokeStyle = 'rgba(47,214,195,.32)';
        ctxW.beginPath();
        ctxW.moveTo(0, centerY + .5); ctxW.lineTo(w, centerY + .5);
        ctxW.stroke();

        // 弦をはじいていない場合は直線（波形なし）のみ表示
        const displayAmp = isVibrating ? currentAmplitude * 0.8 : 0;
        const time = now * 0.003;

        // 時間範囲（横軸）を調整し、高音でも波形が潰れすぎない波長に設定
        const wavelength = 16000 / currentFreq;

        if (displayAmp > 0) {
            // 振幅ガイドライン（赤点線）
            ctxW.setLineDash([4, 4]);
            ctxW.strokeStyle = C_AMP + '99';
            ctxW.lineWidth = 1.5;
            ctxW.beginPath();
            ctxW.moveTo(0, centerY - displayAmp); ctxW.lineTo(w, centerY - displayAmp);
            ctxW.moveTo(0, centerY + displayAmp); ctxW.lineTo(w, centerY + displayAmp);
            ctxW.stroke();
            ctxW.setLineDash([]);

            // 振幅矢印（縦矢印）
            const arrowX = 30;
            ctxW.strokeStyle = C_AMP;
            ctxW.lineWidth = 2;
            ctxW.beginPath();
            ctxW.moveTo(arrowX, centerY - displayAmp);
            ctxW.lineTo(arrowX, centerY + displayAmp);
            ctxW.stroke();
            
            ctxW.fillStyle = C_AMP;
            ctxW.beginPath();
            ctxW.moveTo(arrowX - 5, centerY - displayAmp + 8);
            ctxW.lineTo(arrowX + 5, centerY - displayAmp + 8);
            ctxW.lineTo(arrowX, centerY - displayAmp);
            ctxW.fill();

            ctxW.beginPath();
            ctxW.moveTo(arrowX - 5, centerY + displayAmp - 8);
            ctxW.lineTo(arrowX + 5, centerY + displayAmp - 8);
            ctxW.lineTo(arrowX, centerY + displayAmp);
            ctxW.fill();

            // 波長ガイド（横矢印）
            const arrowY = h - 20;
            const waveStartX = w / 2;
            ctxW.strokeStyle = C_WAVE;
            ctxW.beginPath();
            ctxW.moveTo(waveStartX, arrowY);
            ctxW.lineTo(waveStartX + wavelength, arrowY);
            ctxW.stroke();

            ctxW.fillStyle = C_WAVE;
            ctxW.fillRect(waveStartX, arrowY - 6, 2, 12);
            ctxW.fillRect(waveStartX + wavelength, arrowY - 6, 2, 12);
        }

        // 波形（サイン波または基準直線）の描画
        ctxW.beginPath();
        ctxW.lineWidth = 3;
        ctxW.strokeStyle = isVibrating ? C_TRACE : C_DIMLN;

        for (let x = 0; x < w; x++) {
            const angle = (x / wavelength) * Math.PI * 2 - (isVibrating ? time * 10 : 0);
            const y = centerY + Math.sin(angle) * displayAmp;

            if (x === 0) {
                ctxW.moveTo(x, y);
            } else {
                ctxW.lineTo(x, y);
            }
        }
        ctxW.stroke();
    }

    // アニメーションループ
    function animate(now) {
        if (!isVibrating) {
            currentFreq = calculatePhysics().freq;
        }

        drawMonochord(now);
        drawWave(now);
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
</script>

</body>
</html>
