<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b76f6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rr"><rect x="0" y="0" width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#rr)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- 背景のドットグリッド -->
    <g fill="#ffffff" opacity="0.10">
      <circle cx="76" cy="76" r="5"/><circle cx="166" cy="60" r="4"/><circle cx="446" cy="96" r="5"/>
      <circle cx="60" cy="266" r="4"/><circle cx="452" cy="236" r="4"/><circle cx="86" cy="436" r="5"/>
      <circle cx="426" cy="426" r="5"/><circle cx="256" cy="470" r="4"/><circle cx="356" cy="52" r="4"/>
    </g>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- 原子 × 天球モチーフ -->
    <g stroke="#ffffff" fill="none" stroke-linecap="round">
      <!-- 外周リング(天球) -->
      <circle cx="256" cy="256" r="168" stroke-width="18" opacity="0.55"/>
      <!-- 軌道 -->
      <ellipse cx="256" cy="256" rx="168" ry="64" stroke-width="26" transform="rotate(-24 256 256)"/>
      <ellipse cx="256" cy="256" rx="64" ry="168" stroke-width="26" transform="rotate(-24 256 256)"/>
    </g>
    <!-- 原子核 -->
    <circle cx="256" cy="256" r="50" fill="#ffffff"/>
    <!-- 電子 -->
    <circle cx="256" cy="88" r="24" fill="#ffd166"/>
    <circle cx="409" cy="325" r="24" fill="#7ef0d4"/>
  </g>
</svg>
