<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>地層の変形（断層・褶曲）3Dシミュレーター</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --accent-red: #dc2626;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; text-align: center; -webkit-tap-highlight-color: transparent; }
    
    .container { max-width: 1100px; margin: 0 auto; }

    header { margin-bottom: 16px; }
    h1 { margin: 0; font-size: 1.75rem; font-weight: 800; color: #1e293b; }
    p.subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: 0.9rem; }

    /* 3Dキャンバス領域 */
    #canvas-container {
      width: 100%; height: 480px;
      background: linear-gradient(180deg, #e2e8f0 0%, #cbd5e1 100%);
      border-radius: 16px; position: relative; overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container:active { cursor: grabbing; }

    .overlay-guide {
      position: absolute; top: 12px; left: 12px;
      background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(4px);
      padding: 8px 14px; border-radius: 8px; font-size: 0.8rem;
      color: var(--text-main); text-align: left; border: 1px solid var(--border-color);
      pointer-events: none; font-weight: 600;
    }

    /* コントロールエリア */
    .control-section {
      background: var(--card-bg); border-radius: 12px; padding: 20px; margin-top: 16px;
      border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      text-align: left;
    }

    .section-title { font-weight: 800; font-size: 1rem; color: #1e293b; margin-bottom: 12px; }

    /* 力の選択ボタン */
    .force-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .force-btn {
      padding: 12px; border: 2px solid var(--border-color); background: #f1f5f9;
      border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.9rem;
      color: var(--text-main); transition: all 0.2s; text-align: center;
      touch-action: manipulation;
    }
    .force-btn:hover { border-color: var(--primary); background: #eff6ff; }
    .force-btn.active { border-color: var(--primary); background: #2563eb; color: #ffffff; }

    /* 操作ボタン */
    .action-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    .btn-apply {
      padding: 12px 28px; background: #dc2626; color: white; border: none;
      border-radius: 30px; font-weight: 800; font-size: 1rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(220,38,38,0.25); transition: all 0.2s;
      touch-action: manipulation;
    }
    .btn-apply:hover { background: #b91c1c; transform: translateY(-2px); }
    .btn-reset {
      padding: 12px 20px; background: #475569; color: white; border: none;
      border-radius: 30px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
    }
    .btn-reset:hover { background: #334155; }

    /* 解説カード */
    .info-card {
      background: #f8fafc; border: 1px solid var(--border-color); border-radius: 10px;
      padding: 14px 18px; line-height: 1.6; font-size: 0.9rem;
    }
    .info-card h3 { margin: 0 0 6px 0; font-size: 1.05rem; color: #1e293b; display: flex; align-items: center; gap: 8px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; color: white; }
    .tag-compress { background: #dc2626; }
    .tag-tension { background: #2563eb; }
    .tag-shear { background: #d97706; }

    @media (max-width: 900px) {
      #canvas-container { height: 420px; }
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      #canvas-container { height: 320px; }
      h1 { font-size: 1.25rem; }
      .force-selector { grid-template-columns: 1fr; }
    }
    @media (pointer: coarse) {
      .force-btn, .btn-apply, .btn-reset { min-height: 44px; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="container">
  <header>
    <h1>地層の変形（断層・褶曲）3Dシミュレーター</h1>
    <p class="subtitle">左右から加わる力によって生じる地層のズレとなだらかな曲がりの可視化</p>
  </header>

  <div id="canvas-container">
    <div class="overlay-guide">
      🖱️ マウスドラッグ: 視点回転 | 🔍 ホイール: ズーム | 右ドラッグ: 平行移動
    </div>
  </div>

  <div class="control-section">
    <div class="section-title">1. 大地に加える力を選択してください</div>
    <div class="force-selector">
      <button class="force-btn active" onclick="selectMode('fold')">
        両側から押す力 (圧縮)<br><small>【褶曲 (しゅうきょく)】</small>
      </button>
      <button class="force-btn" onclick="selectMode('reverse')">
        両側から押す力 (圧縮)<br><small>【逆断層】</small>
      </button>
      <button class="force-btn" onclick="selectMode('normal')">
        両側に引っ張る力 (引張)<br><small>【正断層】</small>
      </button>
      <button class="force-btn" onclick="selectMode('strike')">
        水平にすれ違う力 (剪断)<br><small>【横ずれ断層】</small>
      </button>
    </div>

    <div class="action-row">
      <button class="btn-apply" onclick="applyForce()">▶ 力を加える（変形開始）</button>
      <button class="btn-reset" onclick="resetSim()">🔄 元の状態に戻す</button>
    </div>

    <div class="info-card" id="infoCard">
      <!-- 動的テキスト挿入 -->
    </div>
  </div>
</div>

<script>
  let scene, camera, renderer, controls;
  let groundGroup, blockA, blockB, foldMesh;
  let initialFoldY = [];
  let arrowLeftGroup, arrowRightGroup;
  
  let currentMode = 'fold';
  let animProgress = 0;
  let isAnimating = false;

  const modeData = {
    fold: {
      title: '褶曲（しゅうきょく）',
      tag: '圧縮力（押す力）',
      tagClass: 'tag-compress',
      desc: '地層に**左右から押し縮める力**が長時間加わると、破壊されずになだらかな波状にたわみます。隆起した部分を「背斜（はいしゃ）」、くぼんだ部分を「向斜（こうしゃ）」と呼びます。'
    },
    reverse: {
      title: '逆断層（ぎゃくだんそう）',
      tag: '圧縮力（押す力）',
      tagClass: 'tag-compress',
      desc: 'もともと1枚だった地層に**左右から押す力**が加わって割れたものです。斜めの断層面を境界にして、**上側の地層（上盤）が押し上がる**ようにズレ動きます。'
    },
    normal: {
      title: '正断層（せいだんそう）',
      tag: '引張力（引っ張る力）',
      tagClass: 'tag-tension',
      desc: 'もともと1枚だった地層に**左右へ引っ張られる力**が加わって割れたものです。斜めの断層面を境界にして、**上側の地層（上盤）がすり落ちる**ようにズレ動きます。'
    },
    strike: {
      title: '横ずれ断層（よこずれだんそう）',
      tag: '剪断力（すれ違う力）',
      tagClass: 'tag-shear',
      desc: 'もともと1枚だった地層に**水平方向にすれ違う力**が加わって割れたものです。断層面を境にして、大地が前後（水平方向）に交差するようにズレ動きます。'
    }
  };

  function init() {
    const container = document.getElementById('canvas-container');
    const w = container.clientWidth;
    const h = container.clientHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe2e8f0);

    camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 1000);
    camera.position.set(24, 18, 32);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    // 照明設定
    const ambLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(25, 45, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    groundGroup = new THREE.Group();
    scene.add(groundGroup);

    // 力表示用の矢印
    arrowLeftGroup = createArrow(0xdc2626);
    arrowRightGroup = createArrow(0xdc2626);
    scene.add(arrowLeftGroup);
    scene.add(arrowRightGroup);

    const texture = createNaturalStrataTexture();
    buildGeometries(texture);
    updateInfoUI();

    window.addEventListener('resize', onResize);
    animate();
  }

  // 現実的なアースカラー地層テクスチャの生成
  function createNaturalStrataTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const strataColors = [
      '#4d5d36', // 表土・草地
      '#6b523b', // 腐植土層
      '#c2a68c', // 砂岩層
      '#8c6d53', // 泥岩層
      '#a3a3a3', // 凝灰岩・粘土層
      '#594a3e'  // 礫岩・基盤岩
    ];

    const layerH = canvas.height / strataColors.length;
    for (let i = 0; i < strataColors.length; i++) {
      ctx.fillStyle = strataColors[i];
      ctx.fillRect(0, i * layerH, canvas.width, layerH);
      
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(0, (i + 1) * layerH - 3, canvas.width, 3);
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    return texture;
  }

  function applyStrataUV(geometry, totalHeight = 8, totalWidth = 20) {
    const pos = geometry.attributes.position;
    const uvs = geometry.attributes.uv;
    if (!pos || !uvs) return;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const v = (y + totalHeight / 2) / totalHeight;
      const u = (x + totalWidth / 2) / totalWidth;
      uvs.setXY(i, u, v);
    }
    uvs.needsUpdate = true;
  }

  function createArrow(color) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
    
    const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 4.5, 16), mat);
    cylinder.rotation.z = Math.PI / 2;
    group.add(cylinder);

    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.0, 16), mat);
    cone.position.x = 2.25;
    cone.rotation.z = -Math.PI / 2;
    group.add(cone);

    return group;
  }

  function buildGeometries(texture) {
    while(groundGroup.children.length > 0){ 
      groundGroup.remove(groundGroup.children[0]); 
    }

    const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7 });
    const W = 20, H = 8, D = 10;

    if (currentMode === 'fold') {
      const geo = new THREE.BoxGeometry(W, H, D, 40, 10, 1);
      applyStrataUV(geo, H, W);
      foldMesh = new THREE.Mesh(geo, mat);
      foldMesh.castShadow = true;
      foldMesh.receiveShadow = true;
      groundGroup.add(foldMesh);

      const pos = foldMesh.geometry.attributes.position;
      initialFoldY = [];
      for (let i = 0; i < pos.count; i++) {
        initialFoldY.push(pos.getY(i));
      }

    } else if (currentMode === 'strike') {
      const geoA = new THREE.BoxGeometry(W, H, D / 2);
      const geoB = new THREE.BoxGeometry(W, H, D / 2);

      applyStrataUV(geoA, H, W);
      applyStrataUV(geoB, H, W);

      blockA = new THREE.Mesh(geoA, mat);
      blockB = new THREE.Mesh(geoB, mat);

      blockA.position.set(0, 0, D / 4);
      blockB.position.set(0, 0, -D / 4);

      groundGroup.add(blockA);
      groundGroup.add(blockB);

    } else {
      const shapeA = new THREE.Shape();
      shapeA.moveTo(-W / 2, -H / 2);
      shapeA.lineTo(2, -H / 2);
      shapeA.lineTo(-2, H / 2);
      shapeA.lineTo(-W / 2, H / 2);
      shapeA.closePath();

      const shapeB = new THREE.Shape();
      shapeB.moveTo(2, -H / 2);
      shapeB.lineTo(W / 2, -H / 2);
      shapeB.lineTo(W / 2, H / 2);
      shapeB.lineTo(-2, H / 2);
      shapeB.closePath();

      const extrudeOpts = { depth: D, bevelEnabled: false };
      const geoA = new THREE.ExtrudeGeometry(shapeA, extrudeOpts);
      const geoB = new THREE.ExtrudeGeometry(shapeB, extrudeOpts);

      geoA.translate(0, 0, -D / 2);
      geoB.translate(0, 0, -D / 2);

      applyStrataUV(geoA, H, W);
      applyStrataUV(geoB, H, W);

      blockA = new THREE.Mesh(geoA, mat);
      blockB = new THREE.Mesh(geoB, mat);

      blockA.position.set(0, 0, 0);
      blockB.position.set(0, 0, 0);

      groundGroup.add(blockA);
      groundGroup.add(blockB);
    }

    updateArrowPositions();
  }

  function updateArrowPositions() {
    if (currentMode === 'fold' || currentMode === 'reverse') {
      arrowLeftGroup.position.set(-14, 0, 0);
      arrowLeftGroup.rotation.y = 0;
      arrowRightGroup.position.set(14, 0, 0);
      arrowRightGroup.rotation.y = Math.PI;
    } else if (currentMode === 'normal') {
      arrowLeftGroup.position.set(-12, 0, 0);
      arrowLeftGroup.rotation.y = Math.PI;
      arrowRightGroup.position.set(12, 0, 0);
      arrowRightGroup.rotation.y = 0;
    } else if (currentMode === 'strike') {
      arrowLeftGroup.position.set(-12, 0, 2.5);
      arrowLeftGroup.rotation.y = 0;
      arrowRightGroup.position.set(12, 0, -2.5);
      arrowRightGroup.rotation.y = Math.PI;
    }
  }

  function selectMode(mode) {
    if (isAnimating) return;
    currentMode = mode;
    
    document.querySelectorAll('.force-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', ['fold', 'reverse', 'normal', 'strike'][idx] === mode);
    });

    resetSim();
    updateInfoUI();
  }

  function updateInfoUI() {
    const data = modeData[currentMode];
    document.getElementById('infoCard').innerHTML = `
      <h3>${data.title} <span class="tag ${data.tagClass}">${data.tag}</span></h3>
      <div>${data.desc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
    `;
  }

  function applyForce() {
    if (isAnimating) return;
    isAnimating = true;
  }

  function resetSim() {
    isAnimating = false;
    animProgress = 0;

    const texture = createNaturalStrataTexture();
    buildGeometries(texture);
  }

  function animate() {
    requestAnimationFrame(animate);

    if (isAnimating && animProgress < 1.0) {
      animProgress += 0.012;

      if (currentMode === 'fold') {
        // 褶曲：たわみ量をほどよく増やし、画面内に綺麗に収まる高さ（振幅0.85）に調整
        const pos = foldMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const origY = initialFoldY[i];
          const wave = Math.sin(x * 0.25) * 0.85 * animProgress;
          pos.setY(i, origY + wave);
        }
        foldMesh.geometry.attributes.position.needsUpdate = true;
        foldMesh.scale.x = 1 - animProgress * 0.08; // 圧縮率も自然な縮み具合へ微増

      } else if (currentMode === 'reverse') {
        blockB.position.x = -animProgress * 1.1;
        blockB.position.y = animProgress * 2.2;

      } else if (currentMode === 'normal') {
        blockB.position.x = animProgress * 1.1;
        blockB.position.y = -animProgress * 2.2;

      } else if (currentMode === 'strike') {
        blockA.position.x = -animProgress * 2.5;
        blockB.position.x = animProgress * 2.5;
      }
    }

    controls.update();
    renderer.render(scene, camera);
  }

  function onResize() {
    const container = document.getElementById('canvas-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  window.onload = init;
</script>

</body>
</html>
