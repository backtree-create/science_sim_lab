<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>地層の変形（断層・褶曲）3Dシミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  :root{--accent:var(--geo);--accent-soft:var(--geo-soft);}
  .layout{grid-template-columns:1fr;max-width:1120px;}

  /* 3Dステージ */
  #canvas-container{
    width:100%;height:500px;
    border-radius:var(--r-md);
    position:relative;overflow:hidden;
    background:radial-gradient(130% 120% at 50% -10%, #f4f7fc 0%, #e6ebf3 55%, #d9e0ea 100%);
    border:1px solid var(--border);
    box-shadow:inset 0 1px 0 #fff, inset 0 -30px 60px -40px rgba(17,23,38,.45);
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #canvas-container:active{cursor:grabbing;}
  #canvas-container canvas{display:block;}
  .overlay-guide{
    position:absolute;top:12px;left:12px;z-index:2;
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;
    color:var(--text-dim);
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    padding:7px 13px;border-radius:100px;border:1px solid var(--border);
    pointer-events:none;
  }

  /* 力の選択 */
  .force-selector{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;
  }
  .force-btn{
    padding:14px 16px;text-align:left;cursor:pointer;
    background:var(--bg-panel-2);border:1px solid var(--border);
    border-radius:var(--r-md);color:var(--text);
    font-family:var(--font-display);font-size:13px;font-weight:700;line-height:1.5;
    transition:.18s var(--ease);touch-action:manipulation;
    position:relative;overflow:hidden;
  }
  .force-btn::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--border-strong);transition:.18s var(--ease);
  }
  .force-btn small{
    display:block;margin-top:5px;
    font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--text-faint);
  }
  .force-btn:hover{border-color:var(--border-strong);background:#fff;}
  .force-btn.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--text);
  }
  .force-btn.active::before{background:var(--accent);}
  .force-btn.active small{color:var(--accent);}

  /* 操作ボタン */
  .action-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .btn-apply,.btn-reset{
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.04em;
    border-radius:var(--r-sm);padding:12px 20px;cursor:pointer;
    transition:.16s var(--ease);touch-action:manipulation;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-apply{
    background:var(--accent);color:#fff;border:1px solid transparent;font-weight:700;
    box-shadow:0 2px 12px -2px rgba(217,119,6,.6);
  }
  .btn-apply:hover{filter:brightness(1.07);transform:translateY(-1px);}
  .btn-reset{background:var(--bg-panel-2);color:var(--text);border:1px solid var(--border);}
  .btn-reset:hover{border-color:var(--border-strong);background:#fff;}

  /* 解説 */
  .info-card{
    background:var(--bg-panel-2);border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:0 var(--r-md) var(--r-md) 0;
    padding:15px 18px;line-height:1.9;font-size:13.5px;color:var(--text-dim);
  }
  .info-card h3{
    margin:0 0 8px;font-family:var(--font-display);font-size:15px;font-weight:900;color:var(--text);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .info-card strong{color:var(--text);font-weight:700;}
  .tag{
    display:inline-block;padding:3px 10px;border-radius:100px;
    font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:#fff;letter-spacing:.04em;
  }
  .tag-compress{background:#c2410c;}
  .tag-tension{background:#1d4ed8;}
  .tag-shear{background:#a16207;}

  @media (max-width:900px){ #canvas-container{height:420px;} }
  @media (max-width:600px){
    #canvas-container{height:330px;}
    .force-selector{grid-template-columns:1fr;}
    .action-row .btn-apply,.action-row .btn-reset{flex:1 1 auto;justify-content:center;}
  }
  @media (pointer:coarse){
    .force-btn,.btn-apply,.btn-reset{min-height:46px;}
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← ホームへ</a>
  <span class="unit-title">14 ／ 地層の変形（断層・褶曲）</span>
</div>

<div class="sim-header">
  <span class="eyebrow">Crustal Deformation · Folds and Faults</span>
  <h1>地層の変形（断層・褶曲）3Dシミュレーター</h1>
  <p>左右から加わる力によって生じる地層のズレとなだらかな曲がりの可視化</p>
</div>

<div class="layout">

  <div class="panel flush">
    <div id="canvas-container">
      <div class="overlay-guide">ドラッグ：視点回転 ／ ホイール：ズーム ／ 右ドラッグ：平行移動</div>
    </div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>大地に加える力を選ぶ</h2>

    <div class="force-selector">
      <button class="force-btn active" onclick="selectMode('fold')">
        両側から押す力 (圧縮)<small>褶曲（しゅうきょく）</small>
      </button>
      <button class="force-btn" onclick="selectMode('reverse')">
        両側から押す力 (圧縮)<small>逆断層</small>
      </button>
      <button class="force-btn" onclick="selectMode('normal')">
        両側に引っ張る力 (引張)<small>正断層</small>
      </button>
      <button class="force-btn" onclick="selectMode('strike')">
        水平にすれ違う力 (剪断)<small>横ずれ断層</small>
      </button>
    </div>

    <hr class="divider">

    <div class="action-row">
      <button class="btn-apply" onclick="applyForce()">▶ 力を加える（変形開始）</button>
      <button class="btn-reset" onclick="resetSim()">🔄 元の状態に戻す</button>
    </div>

    <hr class="divider">

    <div class="info-card" id="infoCard"><!-- 動的テキスト挿入 --></div>
  </div>

</div>

<script>
  let scene, camera, renderer, controls;
  let groundGroup, blockA, blockB, foldMesh;
  let initialFoldY = [];
  let arrowLeftGroup, arrowRightGroup;
  
  let currentMode = 'fold';
  let animProgress = 0;
  let isAnimating = false;

  const modeData = {
    fold: {
      title: '褶曲（しゅうきょく）',
      tag: '圧縮力（押す力）',
      tagClass: 'tag-compress',
      desc: '地層に**左右から押し縮める力**が長時間加わると、破壊されずになだらかな波状にたわみます。隆起した部分を「背斜（はいしゃ）」、くぼんだ部分を「向斜（こうしゃ）」と呼びます。'
    },
    reverse: {
      title: '逆断層（ぎゃくだんそう）',
      tag: '圧縮力（押す力）',
      tagClass: 'tag-compress',
      desc: 'もともと1枚だった地層に**左右から押す力**が加わって割れたものです。斜めの断層面を境界にして、**上側の地層（上盤）が押し上がる**ようにズレ動きます。'
    },
    normal: {
      title: '正断層（せいだんそう）',
      tag: '引張力（引っ張る力）',
      tagClass: 'tag-tension',
      desc: 'もともと1枚だった地層に**左右へ引っ張られる力**が加わって割れたものです。斜めの断層面を境界にして、**上側の地層（上盤）がすり落ちる**ようにズレ動きます。'
    },
    strike: {
      title: '横ずれ断層（よこずれだんそう）',
      tag: '剪断力（すれ違う力）',
      tagClass: 'tag-shear',
      desc: 'もともと1枚だった地層に**水平方向にすれ違う力**が加わって割れたものです。断層面を境にして、大地が前後（水平方向）に交差するようにズレ動きます。'
    }
  };

  function init() {
    const container = document.getElementById('canvas-container');
    const w = container.clientWidth;
    const h = container.clientHeight;

    scene = new THREE.Scene();
    // 背景は CSS のグラデーションを見せるため透過にする
    scene.fog = new THREE.Fog(0xdfe6ef, 62, 130);

    camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 1000);
    camera.position.set(24, 18, 32);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.target.set(0, 0, 0);
    controls.minDistance = 18;
    controls.maxDistance = 90;

    // 照明設定（陰影で立体感を出しつつ、地層の色を潰さない明るさ）
    scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa6b8, 0.72));
    scene.add(new THREE.AmbientLight(0xffffff, 0.34));

    const dirLight = new THREE.DirectionalLight(0xfff6e8, 1.05);
    dirLight.position.set(25, 45, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    dirLight.shadow.bias = -0.0012;
    scene.add(dirLight);

    const fill = new THREE.DirectionalLight(0xcddcf0, 0.34);
    fill.position.set(-28, 12, -18);
    scene.add(fill);

    // 影を受ける地面（地層の下に薄く敷く）
    const shadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.ShadowMaterial({ opacity: 0.16 })
    );
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = -6.2;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // 目盛りのようなグリッド（スケール感の手がかり）
    const grid = new THREE.GridHelper(120, 24, 0x9aa6b8, 0xc3cbd8);
    grid.position.y = -6.18;
    grid.material.transparent = true;
    grid.material.opacity = 0.22;
    scene.add(grid);

    groundGroup = new THREE.Group();
    scene.add(groundGroup);

    // 力表示用の矢印
    arrowLeftGroup = createArrow(0xdc2626);
    arrowRightGroup = createArrow(0xdc2626);
    scene.add(arrowLeftGroup);
    scene.add(arrowRightGroup);

    const texture = createNaturalStrataTexture();
    buildGeometries(texture);
    updateInfoUI();

    window.addEventListener('resize', onResize);
    animate();
  }

  // 現実的なアースカラー地層テクスチャの生成
  function createNaturalStrataTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');

    // 層ごとに「地の色 → 少し明るい色」と粒の粗さを持たせる
    const strata = [
      { a: '#54653a', b: '#41512c', grain: 'fine',   name: '表土・草地' },
      { a: '#77593f', b: '#5d4531', grain: 'fine',   name: '腐植土層' },
      { a: '#cfb096', b: '#b8977c', grain: 'sand',   name: '砂岩層' },
      { a: '#94745a', b: '#7a5e47', grain: 'mud',    name: '泥岩層' },
      { a: '#adadad', b: '#8f8f8f', grain: 'fine',   name: '凝灰岩・粘土層' },
      { a: '#635345', b: '#4b3e33', grain: 'gravel', name: '礫岩・基盤岩' }
    ];

    const H = canvas.height, W = canvas.width;
    const layerH = H / strata.length;

    for (let i = 0; i < strata.length; i++) {
      const s = strata[i];
      const y0 = i * layerH;

      // 地の色（層内で上下にわずかな濃淡）
      const g = ctx.createLinearGradient(0, y0, 0, y0 + layerH);
      g.addColorStop(0, s.a);
      g.addColorStop(1, s.b);
      ctx.fillStyle = g;
      ctx.fillRect(0, y0, W, layerH);

      // 粒子感（岩相ごとに粒の大きさと密度を変える）
      const spec = {
        fine:   { n: 2600, r: 1.2, a: .10 },
        sand:   { n: 3400, r: 1.9, a: .14 },
        mud:    { n: 1500, r: 1.1, a: .09 },
        gravel: { n:  900, r: 4.6, a: .18 }
      }[s.grain];
      for (let k = 0; k < spec.n; k++) {
        const x = Math.random() * W;
        const y = y0 + Math.random() * layerH;
        const r = spec.r * (0.5 + Math.random());
        ctx.fillStyle = Math.random() < .5
          ? `rgba(255,255,255,${spec.a})`
          : `rgba(0,0,0,${spec.a})`;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * (0.6 + Math.random() * 0.5), Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }

      // 葉理（層の中の細かい縞）
      ctx.strokeStyle = 'rgba(0,0,0,.055)';
      ctx.lineWidth = 1;
      const lam = s.grain === 'gravel' ? 5 : 11;
      for (let k = 1; k < lam; k++) {
        const y = y0 + layerH * (k / lam);
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= W; x += 32) {
          ctx.lineTo(x, y + Math.sin(x * 0.012 + k * 1.7 + i) * 2.4);
        }
        ctx.stroke();
      }

      // 層理面（層と層の境目をはっきり見せる）
      const bY = (i + 1) * layerH;
      ctx.fillStyle = 'rgba(0,0,0,.20)';
      ctx.fillRect(0, bY - 5, W, 5);
      ctx.fillStyle = 'rgba(255,255,255,.13)';
      ctx.fillRect(0, bY - 6.5, W, 1.5);
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.anisotropy = 8;
    return texture;
  }

  function applyStrataUV(geometry, totalHeight = 8, totalWidth = 20) {
    const pos = geometry.attributes.position;
    const uvs = geometry.attributes.uv;
    if (!pos || !uvs) return;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const v = (y + totalHeight / 2) / totalHeight;
      const u = (x + totalWidth / 2) / totalWidth;
      uvs.setXY(i, u, v);
    }
    uvs.needsUpdate = true;
  }

  function createArrow(color) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.35, metalness: 0.05, emissive: new THREE.Color(color).multiplyScalar(0.12) });
    
    const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 4.5, 16), mat);
    cylinder.rotation.z = Math.PI / 2;
    group.add(cylinder);

    const cone = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.0, 16), mat);
    cone.position.x = 2.25;
    cone.rotation.z = -Math.PI / 2;
    group.add(cone);

    return group;
  }

  function buildGeometries(texture) {
    while(groundGroup.children.length > 0){ 
      groundGroup.remove(groundGroup.children[0]); 
    }

    const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.86, metalness: 0.02 });
    const W = 20, H = 8, D = 10;

    if (currentMode === 'fold') {
      const geo = new THREE.BoxGeometry(W, H, D, 40, 10, 1);
      applyStrataUV(geo, H, W);
      foldMesh = new THREE.Mesh(geo, mat);
      foldMesh.castShadow = true;
      foldMesh.receiveShadow = true;
      groundGroup.add(foldMesh);

      const pos = foldMesh.geometry.attributes.position;
      initialFoldY = [];
      for (let i = 0; i < pos.count; i++) {
        initialFoldY.push(pos.getY(i));
      }

    } else if (currentMode === 'strike') {
      const geoA = new THREE.BoxGeometry(W, H, D / 2);
      const geoB = new THREE.BoxGeometry(W, H, D / 2);

      applyStrataUV(geoA, H, W);
      applyStrataUV(geoB, H, W);

      blockA = new THREE.Mesh(geoA, mat);
      blockB = new THREE.Mesh(geoB, mat);

      blockA.position.set(0, 0, D / 4);
      blockB.position.set(0, 0, -D / 4);

      blockA.castShadow = blockA.receiveShadow = true;

      blockB.castShadow = blockB.receiveShadow = true;

      groundGroup.add(blockA);
      groundGroup.add(blockB);

    } else {
      const shapeA = new THREE.Shape();
      shapeA.moveTo(-W / 2, -H / 2);
      shapeA.lineTo(2, -H / 2);
      shapeA.lineTo(-2, H / 2);
      shapeA.lineTo(-W / 2, H / 2);
      shapeA.closePath();

      const shapeB = new THREE.Shape();
      shapeB.moveTo(2, -H / 2);
      shapeB.lineTo(W / 2, -H / 2);
      shapeB.lineTo(W / 2, H / 2);
      shapeB.lineTo(-2, H / 2);
      shapeB.closePath();

      const extrudeOpts = { depth: D, bevelEnabled: false };
      const geoA = new THREE.ExtrudeGeometry(shapeA, extrudeOpts);
      const geoB = new THREE.ExtrudeGeometry(shapeB, extrudeOpts);

      geoA.translate(0, 0, -D / 2);
      geoB.translate(0, 0, -D / 2);

      applyStrataUV(geoA, H, W);
      applyStrataUV(geoB, H, W);

      blockA = new THREE.Mesh(geoA, mat);
      blockB = new THREE.Mesh(geoB, mat);

      blockA.position.set(0, 0, 0);
      blockB.position.set(0, 0, 0);

      blockA.castShadow = blockA.receiveShadow = true;

      blockB.castShadow = blockB.receiveShadow = true;

      groundGroup.add(blockA);
      groundGroup.add(blockB);
    }

    updateArrowPositions();
  }

  function updateArrowPositions() {
    if (currentMode === 'fold' || currentMode === 'reverse') {
      arrowLeftGroup.position.set(-14, 0, 0);
      arrowLeftGroup.rotation.y = 0;
      arrowRightGroup.position.set(14, 0, 0);
      arrowRightGroup.rotation.y = Math.PI;
    } else if (currentMode === 'normal') {
      arrowLeftGroup.position.set(-12, 0, 0);
      arrowLeftGroup.rotation.y = Math.PI;
      arrowRightGroup.position.set(12, 0, 0);
      arrowRightGroup.rotation.y = 0;
    } else if (currentMode === 'strike') {
      arrowLeftGroup.position.set(-12, 0, 2.5);
      arrowLeftGroup.rotation.y = 0;
      arrowRightGroup.position.set(12, 0, -2.5);
      arrowRightGroup.rotation.y = Math.PI;
    }
  }

  function selectMode(mode) {
    if (isAnimating) return;
    currentMode = mode;
    
    document.querySelectorAll('.force-btn').forEach((btn, idx) => {
      btn.classList.toggle('active', ['fold', 'reverse', 'normal', 'strike'][idx] === mode);
    });

    resetSim();
    updateInfoUI();
  }

  function updateInfoUI() {
    const data = modeData[currentMode];
    document.getElementById('infoCard').innerHTML = `
      <h3>${data.title} <span class="tag ${data.tagClass}">${data.tag}</span></h3>
      <div>${data.desc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
    `;
  }

  function applyForce() {
    if (isAnimating) return;
    isAnimating = true;
  }

  function resetSim() {
    isAnimating = false;
    animProgress = 0;

    const texture = createNaturalStrataTexture();
    buildGeometries(texture);
  }

  function animate() {
    requestAnimationFrame(animate);

    if (isAnimating && animProgress < 1.0) {
      animProgress += 0.012;

      if (currentMode === 'fold') {
        // 褶曲：たわみ量をほどよく増やし、画面内に綺麗に収まる高さ（振幅0.85）に調整
        const pos = foldMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const origY = initialFoldY[i];
          const wave = Math.sin(x * 0.25) * 0.85 * animProgress;
          pos.setY(i, origY + wave);
        }
        foldMesh.geometry.attributes.position.needsUpdate = true;
        foldMesh.scale.x = 1 - animProgress * 0.08; // 圧縮率も自然な縮み具合へ微増

      } else if (currentMode === 'reverse') {
        blockB.position.x = -animProgress * 1.1;
        blockB.position.y = animProgress * 2.2;

      } else if (currentMode === 'normal') {
        blockB.position.x = animProgress * 1.1;
        blockB.position.y = -animProgress * 2.2;

      } else if (currentMode === 'strike') {
        blockA.position.x = -animProgress * 2.5;
        blockB.position.x = animProgress * 2.5;
      }
    }

    controls.update();
    renderer.render(scene, camera);
  }

  function onResize() {
    const container = document.getElementById('canvas-container');
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
  }

  window.onload = init;
</script>

</body>
</html>
