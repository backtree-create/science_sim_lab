<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凸レンズとスクリーン</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-assets/inquiry-five.css"><script src="visual-assets/inquiry-five.js"></script></head><body><nav class="topbar"><a class="back" href="index.html">← ホームへ</a><span>SCIENCE SIM LAB</span></nav><header class="sim-header"><h1>凸レンズとスクリーン</h1><p>物体を動かしたら、スクリーンはどこで鮮明になる？</p></header><main class="layout"><section class="panel"><div class="stage"><canvas id="scene" aria-label="凸レンズとスクリーンの観察図"></canvas></div><div class="legend">青・緑・紫：同じ点から出た光 ／ 破線：後方延長</div><div class="statusline" id="status" aria-live="polite"></div></section><section class="panel"><h2>条件を変えて観察</h2><div class="control"><label for="mode">観察</label><select id="mode"><option value="object">物体から出る光</option><option value="parallel">平行な光</option></select></div><div class="control"><label for="f">焦点距離 <output id="fVal">10</output> cm</label><input id="f" type="range" min="5" max="15" step="1" value="10"></div><div class="control"><label for="a">物体からレンズ <output id="aVal">20</output> cm</label><input id="a" type="range" min="2" max="50" step="1" value="20"></div><div class="btnrow"><button class="btn" id="at2f">2f に置く</button><button class="btn" id="atf">f に置く</button><button class="btn" id="inside">f の内側</button></div><div class="control"><label for="screen">スクリーンの距離 <output id="screenVal">30</output> cm</label><input id="screen" type="range" min="1" max="100" step="1" value="30"></div><label><input type="checkbox" id="rays" checked> 光線と像の位置を表示</label><div class="question" id="screenResult"></div><div class="readout" id="lensReadout"></div><button class="btn detail-open" data-dialog="notes">モデルについて</button></section></main><dialog id="notes"><button class="btn close">閉じる</button><p>薄い凸レンズの近軸モデル。1/f=1/a+1/b。光線は物体の先端から異なる高さでレンズへ入る3本。スクリーンの見え方は中心光線による投影と光線の広がりから作ったぼけの模式図。光線図のスクリーンは一部の光が透過する半透明板。回折・収差・レンズの有限口径は省略。焦点上では出射光が平行になり、有限距離のスクリーンに実像を結ばない。</p></dialog><script>
const $=id=>document.getElementById(id);let render;
function draw(c,w,h){
 const f=+$('f').value,a=+$('a').value,s=+$('screen').value,parallel=$('mode').value==='parallel',show=$('rays').checked;
 document.querySelector('.legend').textContent=parallel?'青・緑・紫：軸に平行な光':'青・緑・紫：同じ点から出た光 ／ 破線：後方延長';
 const b=parallel?f:(a===f?Infinity:f*a/(a-f));
 const extent=Math.max(2*f,a,s,Number.isFinite(b)?Math.min(Math.abs(b),100):0);
 const k=Math.min((w-90)/(2*extent),7),x=w/2,y=h*.50,ho=6;
 const X=v=>x+v*k,Y=v=>y-v*k;
 lab.line(c,20,y,w-20,y,'#8b98a8');
 c.fillStyle='#d5e9fc';c.strokeStyle='#145caf';c.lineWidth=2;c.beginPath();c.ellipse(x,y,10,Math.min(85,h*.25),0,0,Math.PI*2);c.fill();c.stroke();
 [-2,-1,1,2].forEach(n=>{lab.line(c,X(n*f),y-5,X(n*f),y+5);lab.text(c,Math.abs(n)===2?'2f':'f',X(n*f),y+23,'#34465b','center')});
 $('a').disabled=parallel;['at2f','atf','inside'].forEach(id=>$(id).disabled=parallel);
 const heights=parallel?[-ho,0,ho]:[ho,0,-ho];
 if(!parallel)lab.arrow(c,X(-a),y,X(-a),Y(ho),'#b83226','物体');
 if(show){heights.forEach((z,i)=>{const color=['#1261b0','#087447','#8147b2'][i],slope=parallel?-z/f:(z-ho)/a-z/f;
 const start=parallel?-(extent): -a;lab.line(c,X(start),Y(parallel?z:ho),x,Y(z),color);
 const end=(w-22-x)/k;lab.line(c,x,Y(z),X(end),Y(z+slope*end),color);
 lab.arrow(c,X(end*.45),Y(z+slope*end*.45),X(end*.55),Y(z+slope*end*.55),color);
 if(b<0)lab.line(c,x,Y(z),X(Math.max(b,-extent)),Y(z+slope*Math.max(b,-extent)),color,[5,5]);
 });
 if(!parallel&&Number.isFinite(b)&&Math.abs(b)<=extent){const ih=-ho*b/a;if(Math.abs(ih*k)<h*.4){lab.arrow(c,X(b),y,X(b),Y(ih),b>0?'#1261b0':'#8147b2',b>0?'実像':'虚像');}}
 }
 lab.line(c,X(s),30,X(s),h-75,'#303c50');lab.text(c,'半透明スクリーン',X(s),h-55,'#303c50','center');
 const spread=parallel?12*Math.abs(1-s/f):12*Math.abs(1+s/a-s/f);
 const focused=spread<.12;
 $('screenResult').textContent=focused?'スクリーン：鮮明': 'スクリーン：光が広がる';
 $('lensReadout').textContent='光の広がり '+spread.toFixed(2)+' cm'+(parallel?'（平行光）':'（物体の先端からの光）');
 $('status').textContent=show?(b===Infinity?'出射光は平行。有限の距離に実像はできない。':(Math.abs(b)>extent||(!parallel&&Math.abs(ho*b/a*k)>h*.4))?'像は表示範囲の外：レンズから '+Math.abs(b).toFixed(1)+' cm':b<0?'破線は光を後ろに延ばした線。光がそこへ進むわけではない。':'実線：光の進む道筋'):'スクリーンを動かして確かめよう';
 // Diffuse screen: simplified projected silhouette; blur follows ray spread.
 c.fillStyle='#1c2a3e';c.fillRect(18,18,180,116);lab.text(c,'スクリーンの見え方',28,39,'#fff');
 c.save();c.beginPath();c.rect(23,45,170,84);c.clip();c.filter='blur('+Math.min(18,spread*1.6)+'px)';
 if(parallel){c.fillStyle='#f9dc60';c.beginPath();c.arc(108,83,focused?3:8,0,Math.PI*2);c.fill()}
 else{lab.arrow(c,108,58,108,Math.min(122,58+ho*s/a*5),'#f9dc60');}
 c.restore();lab.text(c,'ぼけと大きさの模式図',25,153,'#34465b');
 lab.text(c,'目盛りの単位：cm',20,h-18);
}
render=lab.canvas('scene',draw);
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{if($(e.id+'Val'))$(e.id+'Val').textContent=e.value;render()}));
$('at2f').onclick=()=>{$('a').value=2*+$('f').value;$('aVal').textContent=$('a').value;render()};
$('atf').onclick=()=>{$('a').value=$('f').value;$('aVal').textContent=$('a').value;render()};
$('inside').onclick=()=>{$('a').value=Math.max(2,Math.floor(+$('f').value/2));$('aVal').textContent=$('a').value;render()};
</script></body></html>
