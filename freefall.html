<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由落下と空気抵抗</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-assets/inquiry-five.css"><script src="visual-assets/inquiry-five.js"></script><style>.panel .stage{min-height:280px}.panel .controls{gap:10px}.panel .btnrow{margin:5px 0!important}.panel .readout{display:grid;grid-template-columns:1fr 1fr;margin:10px 0}.panel .readout .v{font-size:17px}.panel .btn{padding:6px 9px;min-height:38px}.modelLine{font-size:13px;line-height:1.5;margin:6px 0}.chartWrap{height:160px;flex:none;margin-top:8px}.chartWrap canvas{width:100%;height:100%}.panel .control label{font-size:14px}.panel .controls input{min-height:26px}@media(max-width:850px) and (orientation:portrait){.panel:nth-child(2){columns:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(min-width:851px) and (max-height:650px){.layout{min-height:0}.chartWrap{height:120px}.panel .stage{min-height:180px}}.panel:nth-child(2)>div>label{display:block;margin:4px 0 3px;font-size:14px}.panel:nth-child(2)>div>select{width:100%;min-height:32px;padding:4px}.panel .readout{margin:6px 0}.panel .readout .item{padding:4px}.panel .readout .v{font-size:16px}.viewTools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;flex:none;margin-bottom:5px}.viewTools select{min-height:32px;padding:3px}@media(max-width:850px) and (orientation:portrait){.panel .stage{min-height:190px}.chartWrap{height:135px}} .panel:nth-child(2){padding-bottom:10px}</style></head><body><nav class="topbar"><a class="back" href="index.html">← ホームへ</a><span>SCIENCE SIM LAB</span></nav><header class="sim-header"><h1>自由落下と空気抵抗</h1><p>同じ高さから落とすと、速さと着地までの時間はどう違う？</p></header><main class="layout"><section class="panel"><div class="stage"><canvas id="scene" aria-label="自由落下と空気抵抗の観察図"></canvas></div><div class="modelLine">赤：空気抵抗なし ／ 青：空気抵抗あり（近似モデル）</div><div class="chartWrap"><canvas id="chart" aria-label="速度と時間のグラフ"></canvas></div><div id="status" class="statusline" role="status"></div></section><section class="panel"><div><h2>落下の条件</h2><div class="controls"><div class="control"><label for="diameter">雨粒の直径 <output id="diameterVal">2.0</output> mm</label><input id="diameter" type="range" min="0.5" max="5" step="0.1" value="2"></div><div class="control"><label for="height">開始する高さ <output id="heightVal">1500</output> m</label><input id="height" type="range" min="500" max="3000" step="100" value="1500"></div></div><label for="speed">再生速度</label><select id="speed"><option value="1">実時間</option><option value="10" selected>10倍速</option><option value="50">50倍速</option></select><div class="btnrow"><button class="btn primary" id="drop">落とす</button><button class="btn" id="pause">再開</button><button class="btn" id="reset">リセット</button></div><label for="graphRange">グラフの範囲（手動）</label><select id="graphRange"><option value="early">最初の3秒・0〜30 m/s</option><option value="long">最初の30秒・0〜300 m/s</option></select></div><div><h2>着地までを比べる</h2><div class="readout" id="values"></div><div class="control"><label for="time">観察時刻 <output id="timeVal">0</output> s</label><input id="time" type="range" min="0" max="300" step="0.01" value="0"></div><div class="btnrow"><button class="btn" id="landNo">抵抗なしの着地</button><button class="btn" id="landRes">抵抗ありの着地</button><button class="btn" data-dialog="notes">モデル</button></div></div></section></main><dialog id="notes"><button class="btn close">閉じる</button><p>静止から落とす。重力加速度9.8 m/s²、空気抵抗は速さの2乗に比例。終端速度は従来の経験式 v=9.65−10.3 exp(−0.6D)（D:mm）を使用し、抵抗係数を定める。雨粒の変形・分裂・風・空気密度の高度変化は扱わない。高さは0〜3000mで固定。着地後の衝突・変形は計算しない。</p></dialog><script>const $=id=>document.getElementById(id),g=9.8;let running=false,t=0;const blue='#006caa',red='#b83226',gold='#936000';
function card(label,value){return '<div class="item"><div class="k">'+label+'</div><div class="v">'+value+'</div></div>'}
function plot(c,w,h,xMax,yMin,yMax,curves,marker){const L=48,R=w-22,T=23,B=h-30,X=x=>L+(R-L)*x/xMax,Y=y=>B-(B-T)*(y-yMin)/(yMax-yMin);for(let i=0;i<=4;i++){const v=yMin+(yMax-yMin)*i/4;lab.line(c,L,Y(v),R,Y(v),'#d1dae3');lab.text(c,String(Number(v.toFixed(2))),L-6,Y(v)+4,'#46566b','right');const tt=xMax*i/4;lab.text(c,String(Number(tt.toFixed(2))),X(tt),B+17,'#46566b','center')}lab.text(c,'m/s',3,14);lab.text(c,'時間 s',R,h-1,'#46566b','right');c.save();c.beginPath();c.rect(L,T,R-L,B-T);c.clip();for(const q of curves){c.beginPath();c.lineWidth=2.5;c.strokeStyle=q.color;for(let i=0;i<=160;i++){const u=Math.min(q.end,xMax)*i/160;const x=X(u),y=Y(q.fn(u));i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}if(marker<=xMax)lab.line(c,X(marker),T,X(marker),B,'#263e55',[3,4]);c.restore()}
function circle(c,x,y,color){c.beginPath();c.arc(x,y,7,0,2*Math.PI);c.fillStyle=color;c.fill();c.strokeStyle='white';c.lineWidth=2;c.stroke()}

function vtFor(d){return 9.65-10.3*Math.exp(-.6*d)}
function distance(time,vt){const a=g*time/vt;return vt*vt/g*(a+Math.log1p(Math.exp(-2*a))-Math.LN2)}
function fallTime(height,vt){const a=g*height/(vt*vt);return vt/g*(a+Math.log1p(Math.sqrt(-Math.expm1(-2*a))))}
function parameters(){const height=+$('height').value,vt=vtFor(+$('diameter').value);return {height,vt,endNo:Math.sqrt(2*height/g),endRes:fallTime(height,vt)}}
function reset(){running=false;t=0;refresh()}
function refresh(){const p=parameters();$('heightVal').textContent=p.height;$('diameterVal').textContent=(+$('diameter').value).toFixed(1);$('time').max=p.endRes;$('time').value=t;$('timeVal').textContent=t.toFixed(1);$('values').innerHTML=card('抵抗なし：着地時刻',p.endNo.toFixed(1)+' s')+card('抵抗あり：着地時刻',p.endRes.toFixed(1)+' s')+card('抵抗なし：着地直前',Math.sqrt(2*g*p.height).toFixed(1)+' m/s')+card('抵抗あり：終端速度',p.vt.toFixed(2)+' m/s');$('status').textContent='経過 '+t.toFixed(1)+' s ／ '+(t>=p.endRes?'両方とも着地':t>=p.endNo?'抵抗なしは着地・抵抗ありは落下中':running?'落下中':'停止中');if(t>($('graphRange').value==='early'?3:30))$('status').textContent+=' ／ 現在時刻はグラフ範囲外';$('pause').textContent=running?'一時停止':'再開';drawScene();drawGraph()}
function scene(c,w,h){const p=parameters(),T=42,B=h-70,k=(B-T)/3000,Y=alt=>B-alt*k,xA=w*.36,xB=w*.73;for(let z=0;z<=3000;z+=500){lab.line(c,55,Y(z),w-20,Y(z),'#d5dee7');lab.text(c,z+'',48,Y(z)+4,'#46566b','right')}lab.text(c,'地上からの高さ m',18,19);const start=Y(p.height);lab.line(c,70,start,w-20,start,'#6d7f90',[5,4]);lab.text(c,'開始 '+p.height+' m',75,start-9);lab.text(c,'抵抗なし',xA,30,red,'center');lab.text(c,'抵抗あり',xB,30,blue,'center');const a=Math.min(t,p.endNo),b=Math.min(t,p.endRes),ha=Math.max(0,p.height-.5*g*a*a),hb=Math.max(0,p.height-distance(b,p.vt));circle(c,xA,Y(ha),red);circle(c,xB,Y(hb),blue);lab.text(c,ha.toFixed(1)+' m',xA+12,Y(ha)-10,red);lab.text(c,hb.toFixed(1)+' m',xB+12,Y(hb)-10,blue);lab.text(c,t>=p.endNo?'着地':(g*a).toFixed(1)+' m/s',xA,B+27,red,'center');lab.text(c,t>=p.endRes?'着地':(p.vt*Math.tanh(g*b/p.vt)).toFixed(1)+' m/s',xB,B+27,blue,'center');lab.text(c,'丸は雨粒の位置を表す拡大記号',w/2,h-10,'#46566b','center')}
function graph(c,w,h){const p=parameters(),early=$('graphRange').value==='early',maxT=early?3:30,maxV=early?30:300;plot(c,w,h,maxT,0,maxV,[{color:red,end:p.endNo,fn:u=>g*u},{color:blue,end:p.endRes,fn:u=>p.vt*Math.tanh(g*u/p.vt)}],t);lab.text(c,'落下中の速度（着地で終了）',58,14)}
const drawScene=lab.canvas('scene',scene),drawGraph=lab.canvas('chart',graph);$('drop').onclick=()=>{t=0;running=true;refresh()};$('pause').onclick=()=>{if(t<parameters().endRes)running=!running;refresh()};$('reset').onclick=reset;$('landNo').onclick=()=>{running=false;t=parameters().endNo;refresh()};$('landRes').onclick=()=>{running=false;t=parameters().endRes;refresh()};$('height').oninput=reset;$('diameter').oninput=reset;$('time').oninput=()=>{running=false;t=+$('time').value;refresh()};$('graphRange').oninput=refresh;let last=performance.now();function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(running){t=Math.min(parameters().endRes,t+dt*+$('speed').value);if(t>=parameters().endRes)running=false;refresh()}requestAnimationFrame(loop)}refresh();requestAnimationFrame(loop);
</script></body></html>
