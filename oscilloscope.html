<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>理科：簡易WEBオシロスコープ（音の波形観察）</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #121212; color: #e0e0e0; margin: 0; padding: 20px; text-align: center; -webkit-tap-highlight-color: transparent; }
    .card { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #00f5d4; }
    
    .btn { padding: 10px 24px; font-size: 1rem; font-weight: bold; border: none; background: #00f5d4; color: #121212; border-radius: 20px; cursor: pointer; transition: all 0.2s; margin: 5px; touch-action: manipulation; }
    .btn:hover { background: #00bbf9; }
    .btn-stop { background: #f72585; color: #fff; }

    /* メーターディスプレイ */
    .dashboard { display: flex; justify-content: space-around; background: #2b2b2b; padding: 15px; border-radius: 12px; margin: 15px 0; }
    .data-box { display: flex; flex-direction: column; align-items: center; }
    .data-label { font-size: 0.85rem; color: #aaa; margin-bottom: 4px; }
    .data-value { font-size: 1.5rem; font-weight: bold; color: #00f5d4; }

    /* オシロスコープ画面 */
    canvas { background: #050d0a; border: 2px solid #005f73; border-radius: 8px; box-shadow: inset 0 0 10px rgba(0,255,200,0.1); width: 100%; max-width: 760px; height: 320px; touch-action: manipulation; }

    /* コントロールバー */
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 15px; background: #2b2b2b; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    input[type=range] { cursor: pointer; }

    .hint { background: #1f2d3d; border-left: 4px solid #00f5d4; padding: 10px 15px; text-align: left; margin-top: 20px; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; color: #d0d0d0; }

    /* ---------- モバイル・タブレット対応 ---------- */
    @media (max-width: 600px) {
      body { padding: 12px; }
      .card { padding: 16px 12px; }
      .dashboard { flex-wrap: wrap; gap: 12px; padding: 12px; }
      .controls { gap: 12px; }
      .control-group { flex-wrap: wrap; justify-content: center; }
      canvas { height: 240px; }
    }
    @media (pointer: coarse) {
      .btn { min-height: 44px; }
      input[type=range] { height: 36px; min-width: 140px; }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>簡易WEBオシロスコープ</h2>

  <div>
    <button class="btn" id="startBtn" onclick="toggleAudio()">🎤 マイクを開始</button>
    <button class="btn btn-stop" id="freezeBtn" onclick="toggleFreeze()" disabled>⏸️ 波形を静止</button>
  </div>

  <!-- 数値モニタリング画面 -->
  <div class="dashboard">
    <div class="data-box">
      <div class="data-label">音の大小（振幅レベル）</div>
      <div class="data-value" id="volVal">0 %</div>
    </div>
    <div class="data-box">
      <div class="data-label">音の高低（周波数）</div>
      <div class="data-value" id="freqVal">-- Hz</div>
    </div>
    <div class="data-box">
      <div class="data-label">推定音名</div>
      <div class="data-value" id="noteVal">--</div>
    </div>
  </div>

  <!-- 波形表示用キャンバス -->
  <canvas id="scopeCanvas" width="760" height="320"></canvas>

  <!-- 操作ダイヤル風調整 -->
  <div class="controls">
    <div class="control-group">
      <label for="gainSlider">縦軸（音の大きさ倍率）:</label>
      <input type="range" id="gainSlider" min="1" max="10" value="3">
    </div>
    <div class="control-group">
      <label for="speedSlider">横軸（時間スケール）:</label>
      <input type="range" id="speedSlider" min="1" max="8" value="2">
    </div>
  </div>

  <div class="hint">
    <strong>【観察と実験のヒント】</strong><br>
    ・<strong>大きな声・小さな声：</strong> 声の大きさを変えると、波の上下の高さ（振幅）がどう変わるか観察しよう。<br>
    ・<strong>高い声・低い声：</strong> ソプラノのような高い声や笛の音を出すと波の山が詰まり（周波数が高い）、低い声を出すと波の山がゆったり伸びます。<br>
    ・<strong>観察のポイント：</strong> 「波形を静止」ボタンを押すと、きれいに1波分をストップして作図や観察ができます。
  </div>
</div>

<script>
  let audioCtx = null;
  let analyser = null;
  let micStream = null;
  let isRunning = false;
  let isFrozen = false;
  let animId = null;

  const canvas = document.getElementById('scopeCanvas');
  const ctx = canvas.getContext('2d');

  // 表示サイズ（CSS px）に合わせ、devicePixelRatio対応で描画バッファを設定する
  let W = canvas.width;   // 論理幅（CSS px）
  let H = canvas.height;  // 論理高さ（CSS px）
  let lastTimeData = null; // 静止中の再描画用に直近の波形データを保持

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (rect.width > 0) W = Math.round(rect.width);
    if (rect.height > 0) H = Math.round(rect.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isFrozen && lastTimeData) {
      renderWave(lastTimeData); // 静止中の波形を新しいサイズで描き直す
    } else {
      clearCanvas(); // 実行中は次のフレームで再描画される
    }
  }
  window.addEventListener('resize', resizeCanvas);

  const volVal = document.getElementById('volVal');
  const freqVal = document.getElementById('freqVal');
  const noteVal = document.getElementById('noteVal');
  const freezeBtn = document.getElementById('freezeBtn');

  // 音名変換用（A4 = 440Hz）
  const noteNames = ["ド", "ド#", "レ", "レ#", "ミ", "ファ", "ファ#", "ソ", "ソ#", "ラ", "ラ#", "シ"];

  async function toggleAudio() {
    if (!isRunning) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = audioCtx.createMediaStreamSource(micStream);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048; // 波形データの解像度
        source.connect(analyser);

        isRunning = true;
        document.getElementById('startBtn').innerText = "⏹️ マイクを停止";
        freezeBtn.disabled = false;
        draw();
      } catch (err) {
        alert("マイクへのアクセスが拒否されたか、マイクが見つかりませんでした。");
        console.error(err);
      }
    } else {
      stopAudio();
    }
  }

  function stopAudio() {
    if (animId) cancelAnimationFrame(animId);
    if (micStream) micStream.getTracks().forEach(track => track.stop());
    if (audioCtx) audioCtx.close();
    isRunning = false;
    isFrozen = false;
    lastTimeData = null;
    document.getElementById('startBtn').innerText = "🎤 マイクを開始";
    freezeBtn.innerText = "⏸️ 波形を静止";
    freezeBtn.disabled = true;
    volVal.innerText = "0 %";
    freqVal.innerText = "-- Hz";
    noteVal.innerText = "--";
    clearCanvas();
  }

  function toggleFreeze() {
    isFrozen = !isFrozen;
    freezeBtn.innerText = isFrozen ? "▶️ 再開" : "⏸️ 波形を静止";
    if (!isFrozen) draw();
  }

  function clearCanvas() {
    ctx.fillStyle = '#050d0a';
    ctx.fillRect(0, 0, W, H);
    drawGrid();
  }

  // オシロスコープの背景グリッドを描画
  function drawGrid() {
    ctx.strokeStyle = '#002b22';
    ctx.lineWidth = 1;
    const gridSpacing = 40;

    for (let x = 0; x < W; x += gridSpacing) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSpacing) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // センター軸
    ctx.strokeStyle = '#005f73';
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  }

  function draw() {
    if (!isRunning || isFrozen) return;

    animId = requestAnimationFrame(draw);

    const bufferLength = analyser.fftSize;
    const timeData = new Float32Array(bufferLength);
    analyser.getFloatTimeDomainData(timeData);
    lastTimeData = timeData;

    // 1. 音の大小（RMS・実効値計算）
    let sumSquares = 0;
    for (let i = 0; i < bufferLength; i++) {
      sumSquares += timeData[i] * timeData[i];
    }
    const rms = Math.sqrt(sumSquares / bufferLength);
    const volumePercent = Math.min(100, Math.round(rms * 500));
    volVal.innerText = `${volumePercent} %`;

    // 2. 音の高低（自己相関法による基本周波数推定）
    const pitch = autoCorrelate(timeData, audioCtx.sampleRate);
    if (pitch !== -1 && volumePercent > 3) {
      freqVal.innerText = `${Math.round(pitch)} Hz`;
      noteVal.innerText = getNoteName(pitch);
    } else {
      freqVal.innerText = "-- Hz";
      noteVal.innerText = "--";
    }

    // 3. 波形（タイムドメイン）の描画
    renderWave(timeData);
  }

  // 波形（タイムドメイン）の描画本体（リサイズ時の再描画にも使用）
  function renderWave(timeData) {
    const bufferLength = timeData.length;

    clearCanvas();

    const gain = parseFloat(document.getElementById('gainSlider').value);
    const speed = parseInt(document.getElementById('speedSlider').value);

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#00f5d4';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00f5d4';
    ctx.beginPath();

    const sliceWidth = (W * 1.0) / (bufferLength / speed);
    let x = 0;

    // トリガー（波形の描画開始位置を正のゼロクロスに合わせることで画面のチラつきを抑える）
    let triggerOffset = 0;
    for (let i = 0; i < bufferLength / 2; i++) {
      if (timeData[i] < 0 && timeData[i + 1] >= 0) {
        triggerOffset = i;
        break;
      }
    }

    for (let i = triggerOffset; i < bufferLength; i += speed) {
      const v = timeData[i] * gain;
      const y = (H / 2) - (v * (H / 2));

      if (i === triggerOffset) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }

      x += sliceWidth;
      if (x > W) break;
    }

    ctx.stroke();
    ctx.shadowBlur = 0; // シャドウのリセット
  }

  // 自己相関法によるピッチ検出関数
  function autoCorrelate(buf, sampleRate) {
    let SIZE = buf.length;
    let c = new Float32Array(SIZE);
    for (let i = 0; i < SIZE; i++) {
      for (let j = 0; j < SIZE - i; j++) {
        c[i] = c[i] + buf[j] * buf[j + i];
      }
    }

    let d = 0;
    while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < SIZE; i++) {
      if (c[i] > maxval) {
        maxval = c[i];
        maxpos = i;
      }
    }
    let T0 = maxpos;

    if (T0 === -1 || c[maxpos] / c[0] < 0.2) return -1; // 信号が不鮮明な場合
    return sampleRate / T0;
  }

  // 周波数から音名への変換
  function getNoteName(frequency) {
    const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
    const midi = Math.round(noteNum) + 69;
    const noteIndex = (midi % 12 + 12) % 12;
    return noteNames[noteIndex];
  }

  resizeCanvas();
</script>

</body>
</html>
