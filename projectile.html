<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投射運動を比べる</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="visual-assets/inquiry-five.css"><script src="visual-assets/inquiry-five.js"></script><style>.panel .stage{min-height:280px}.panel .controls{gap:10px}.panel .btnrow{margin:5px 0!important}.panel .readout{display:grid;grid-template-columns:1fr 1fr;margin:10px 0}.panel .readout .v{font-size:17px}.panel .btn{padding:6px 9px;min-height:38px}.modelLine{font-size:13px;line-height:1.5;margin:6px 0}.chartWrap{height:160px;flex:none;margin-top:8px}.chartWrap canvas{width:100%;height:100%}.panel .control label{font-size:14px}.panel .controls input{min-height:26px}@media(max-width:850px) and (orientation:portrait){.panel:nth-child(2){columns:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(min-width:851px) and (max-height:650px){.layout{min-height:0}.chartWrap{height:120px}.panel .stage{min-height:180px}}.panel:nth-child(2)>div>label{display:block;margin:4px 0 3px;font-size:14px}.panel:nth-child(2)>div>select{width:100%;min-height:32px;padding:4px}.panel .readout{margin:6px 0}.panel .readout .item{padding:4px}.panel .readout .v{font-size:16px}.viewTools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;flex:none;margin-bottom:5px}.viewTools select{min-height:32px;padding:3px}@media(max-width:850px) and (orientation:portrait){.panel .stage{min-height:190px}.chartWrap{height:135px}} .panel:nth-child(2){padding-bottom:10px}</style></head><body><nav class="topbar"><a class="back" href="index.html">← ホームへ</a><span>SCIENCE SIM LAB</span></nav><header class="sim-header"><h1>投射運動を比べる</h1><p>最高点でも動いている？ 角度を変えて軌道を比べよう。</p></header><main class="layout"><section class="panel"><div class="viewTools"><label for="zoom">表示倍率（手動）</label><select id="zoom"><option value="1">全範囲</option><option value="2" selected>2倍</option><option value="4">4倍</option></select><label><input id="vectors" type="checkbox" checked>速度の矢印</label><label><input id="compare" type="checkbox" checked>前回条件の軌道（灰色破線）</label></div><div class="stage"><canvas id="scene" aria-label="投射運動を比べるの観察図"></canvas></div><div class="modelLine">青：水平速度 ／ 黄褐色：鉛直速度 ／ 赤：重力（速度とは別の量）</div><div class="chartWrap"><canvas id="chart" aria-label="速度と時間のグラフ"></canvas></div><div id="status" class="statusline" role="status"></div></section><section class="panel"><div><h2>次の発射条件</h2><div class="controls"><div class="control"><label for="v0">初速度 <output id="v0Val">20</output> m/s</label><input id="v0" type="range" min="5" max="40" value="20"></div><div class="control"><label for="angle">投射角 <output id="angleVal">45</output>°</label><input id="angle" type="range" min="5" max="85" value="45"></div></div><div class="btnrow"><button class="btn primary" id="launch">発射</button><button class="btn" id="pause">一時停止</button><button class="btn" id="reset">リセット</button></div><p id="shotLabel" class="modelLine"></p></div><div><h2>位置と速度</h2><div class="readout" id="values"></div><div class="control"><label for="time">観察時刻 <output id="timeVal">0</output> s</label><input id="time" type="range" min="0" max="3" step="0.001" value="0"></div><div class="btnrow"><button class="btn" id="apex">最高点</button><button class="btn" id="land">着地直前</button><button class="btn" data-dialog="notes">モデル</button></div></div></section></main><dialog id="notes"><button class="btn close">閉じる</button><p>空気抵抗なし、g=9.8 m/s²。発射時の条件で運動を計算する。座標の縮尺は表示倍率を手動で変えたときだけ変化する（画面サイズ変更を除く）。グラフは0〜9秒、−40〜40 m/sで固定。着地後は衝突を計算せず、着地直前の状態を保持する。</p></dialog><script>const $=id=>document.getElementById(id),g=9.8;let running=false,t=0;const blue='#006caa',red='#b83226',gold='#936000';
function card(label,value){return '<div class="item"><div class="k">'+label+'</div><div class="v">'+value+'</div></div>'}
function plot(c,w,h,xMax,yMin,yMax,curves,marker){const L=48,R=w-22,T=23,B=h-30,X=x=>L+(R-L)*x/xMax,Y=y=>B-(B-T)*(y-yMin)/(yMax-yMin);for(let i=0;i<=4;i++){const v=yMin+(yMax-yMin)*i/4;lab.line(c,L,Y(v),R,Y(v),'#d1dae3');lab.text(c,String(Number(v.toFixed(2))),L-6,Y(v)+4,'#46566b','right');const tt=xMax*i/4;lab.text(c,String(Number(tt.toFixed(2))),X(tt),B+17,'#46566b','center')}lab.text(c,'m/s',3,14);lab.text(c,'時間 s',R,h-1,'#46566b','right');c.save();c.beginPath();c.rect(L,T,R-L,B-T);c.clip();for(const q of curves){c.beginPath();c.lineWidth=2.5;c.strokeStyle=q.color;for(let i=0;i<=160;i++){const u=Math.min(q.end,xMax)*i/160;const x=X(u),y=Y(q.fn(u));i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}if(marker<=xMax)lab.line(c,X(marker),T,X(marker),B,'#263e55',[3,4]);c.restore()}
function circle(c,x,y,color){c.beginPath();c.arc(x,y,7,0,2*Math.PI);c.fillStyle=color;c.fill();c.strokeStyle='white';c.lineWidth=2;c.stroke()}

let shot=null,previous=null;
function parameters(v=+$('v0').value,angle=+$('angle').value){const rad=angle*Math.PI/180,vx=v*Math.cos(rad),vy=v*Math.sin(rad);return {v,angle,vx,vy,end:2*vy/g,range:2*vx*vy/g,peak:vy*vy/(2*g)}}
function at(p,time){return {x:p.vx*time,y:Math.max(0,p.vy*time-.5*g*time*time),vx:p.vx,vy:p.vy-g*time}}
function refresh(){const p=shot||parameters();$('v0Val').textContent=$('v0').value;$('angleVal').textContent=$('angle').value;$('time').max=p.end;$('time').value=t;$('timeVal').textContent=t.toFixed(2);const q=at(p,t);$('values').innerHTML=card('水平位置',q.x.toFixed(1)+' m')+card('高さ',q.y.toFixed(1)+' m')+card('水平速度',q.vx.toFixed(1)+' m/s')+card('鉛直速度',(Math.abs(q.vy)<.00001?0:q.vy).toFixed(1)+' m/s')+card('最高点',p.peak.toFixed(1)+' m')+card('到達距離',p.range.toFixed(1)+' m');$('status').textContent=shot?(t>=p.end?'着地直前の位置・速度を保持':running?'飛行中':'一時停止'):'発射前：選んだ条件の予測';$('shotLabel').textContent=shot?'今回の発射：'+p.v+' m/s・'+p.angle+'°（上の設定は次回用）':'設定した条件で発射';$('pause').textContent=running?'一時停止':'再開';drawScene();drawGraph()}
function scene(c,w,h){const p=shot||parameters(),q=at(p,t),zoom=+$('zoom').value,k=Math.min((w-100)/180,(h-110)/90)*zoom,L=48,B=h-65,R=w-30,T=30;const X=x=>L+x*k,Y=y=>B-y*k;for(let x=0;X(x)<=R;x+=20){lab.line(c,X(x),T,X(x),B,'#e0e5ec');lab.text(c,x+'',X(x),B+20,'#46566b','center')}for(let y=0;Y(y)>=T;y+=20){lab.line(c,L,Y(y),R,Y(y),'#e0e5ec');lab.text(c,y+'',L-8,Y(y)+4,'#46566b','right')}lab.text(c,'高さ m',L,18);lab.text(c,'水平距離 m',R,B+40,'#46566b','right');c.save();c.beginPath();c.rect(L-8,T,R-L+8,B-T+8);c.clip();function path(p,color,end,dash){c.strokeStyle=color;c.lineWidth=2.5;c.setLineDash(dash);c.beginPath();for(let i=0;i<=160;i++){const q=at(p,end*i/160);i?c.lineTo(X(q.x),Y(q.y)):c.moveTo(X(q.x),Y(q.y))}c.stroke();c.setLineDash([])}if(previous&&$('compare').checked)path(previous,'#6d7683',previous.end,[5,5]);if(!shot)path(p,'#6d7683',p.end,[3,5]);if(shot)path(p,blue,t,[]);circle(c,X(q.x),Y(q.y),blue);c.restore();if(X(q.x)<=R&&Y(q.y)>=T){if($('vectors').checked){lab.arrow(c,X(q.x),Y(q.y),X(q.x)+q.vx*1.4,Y(q.y),blue,'vx');lab.arrow(c,X(q.x),Y(q.y),X(q.x),Y(q.y)-q.vy*1.4,gold,'vy')}lab.arrow(c,X(q.x)-13,Y(q.y),X(q.x)-13,Y(q.y)+28,red);lab.text(c,'重力',X(q.x)-18,Y(q.y)+42,red,'right')}else lab.text(c,'物体は画面外：表示倍率を下げる',L,T+22,red);}
function graph(c,w,h){const p=shot||parameters();plot(c,w,h,9,-40,40,[{color:blue,end:p.end,fn:()=>p.vx},{color:gold,end:p.end,fn:u=>p.vy-g*u}],t)}
const drawScene=lab.canvas('scene',scene),drawGraph=lab.canvas('chart',graph);
$('launch').onclick=()=>{previous=shot;shot=parameters();t=0;running=true;refresh()};$('pause').onclick=()=>{if(shot&&t<shot.end)running=!running;refresh()};$('reset').onclick=()=>{running=false;shot=null;t=0;refresh()};$('apex').onclick=()=>{if(!shot)shot=parameters();running=false;t=shot.end/2;refresh()};$('land').onclick=()=>{if(!shot)shot=parameters();running=false;t=shot.end;refresh()};$('time').oninput=()=>{if(!shot)shot=parameters();running=false;t=+$('time').value;refresh()};document.querySelectorAll('input:not(#time),select').forEach(el=>el.oninput=refresh);let last=performance.now();function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(running&&shot){t=Math.min(shot.end,t+dt);if(t>=shot.end)running=false;refresh()}requestAnimationFrame(loop)}refresh();requestAnimationFrame(loop);
</script></body></html>
