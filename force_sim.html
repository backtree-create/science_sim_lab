<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>中3理科：力の合成と分解シミュレーター</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f4f8; margin: 0; padding: 20px; text-align: center; color: #2b2d42; -webkit-tap-highlight-color: transparent; }
    .card { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1d3557; }
    
    .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .tab-btn { padding: 10px 24px; font-size: 1rem; font-weight: bold; border: 2px solid #457b9d; background: #fff; color: #457b9d; border-radius: 25px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: #457b9d; color: #fff; }
    
    .options { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; font-size: 0.95rem; }
    .options label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
    
    canvas { background: #fafafa; border: 2px solid #e0e0e0; border-radius: 12px; cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; height: auto; }
    
    .legend { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-weight: bold; font-size: 0.95rem; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
    .bg-red { background: #e63946; }
    .bg-blue { background: #1d3557; }
    .bg-green { background: #2a9d8f; }

    .hint { background: #f1faee; border-left: 4px solid #457b9d; padding: 10px 15px; text-align: left; margin-top: 20px; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; }

    button { touch-action: manipulation; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .card { padding: 14px; }
      .nav-tabs { flex-wrap: wrap; }
      .tab-btn { padding: 10px 14px; font-size: 0.9rem; }
      .options { flex-wrap: wrap; gap: 10px; }
      .legend { flex-wrap: wrap; gap: 10px; }
    }

    @media (pointer: coarse) {
      .tab-btn { min-height: 44px; }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>力の合成と分解（平行四辺形の法則）</h2>

  <!-- モード切替タブ -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="btnCombine" onclick="setMode('combine')">① 力の合成（2つの力をまとめる）</button>
    <button class="tab-btn" id="btnResolve" onclick="setMode('resolve')">② 力の分解（1つの力を分ける）</button>
  </div>

  <!-- オプション設定 -->
  <div class="options">
    <label><input type="checkbox" id="chkGrid" checked onchange="render()"> 方眼紙（マス目）を表示</label>
    <label><input type="checkbox" id="chkValues" checked onchange="render()"> 力の大きさを表示</label>
  </div>

  <!-- メイン描画エリア -->
  <canvas id="simCanvas" width="650" height="420"></canvas>

  <!-- 凡例 -->
  <div class="legend">
    <div class="legend-item"><span class="dot bg-blue"></span> 分力 A</div>
    <div class="legend-item"><span class="dot bg-green"></span> 分力 B</div>
    <div class="legend-item"><span class="dot bg-red"></span> 合力（元の力）</div>
  </div>

  <!-- 動的なヒント解説 -->
  <div class="hint" id="hintBox">
    <strong>【合成モードの操作ヒント】</strong><br>
    青と緑の矢印の先端をドラッグして動かしてみよう。2つの力が作る平行四辺形の対角線に「合力（赤色の矢印）」が作られます。2つの力の角度を変えると合力の大きさはどう変わるかな？
  </div>
</div>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  
  let mode = 'combine'; // 'combine' または 'resolve'
  const origin = { x: 325, y: 250 }; // 作用点（中心）

  // 合成モード用のベクトル（相対座標）
  let vA = { x: 120, y: -120 };
  let vB = { x: -100, y: -80 };

  // 分解モード用のベクトル＆分解軸角度（ラジアン）
  let vResult = { x: 0, y: -160 }; // 元の力
  let angleAxisA = -Math.PI / 4;   // 軸A（約 -45度）
  let angleAxisB = -Math.PI * 3 / 4; // 軸B（約 -135度）

  let activeHandle = null;

  function setMode(newMode) {
    mode = newMode;
    document.getElementById('btnCombine').classList.toggle('active', mode === 'combine');
    document.getElementById('btnResolve').classList.toggle('active', mode === 'resolve');
    
    const hint = document.getElementById('hintBox');
    if (mode === 'combine') {
      hint.innerHTML = '<strong>【合成モードの操作ヒント】</strong><br>青と緑の矢印の先端をドラッグして動かしてみよう。2つの力が作る平行四辺形の対角線に「合力（赤色の矢印）」が作られます。2つの力の角度を変えると合力の大きさはどう変わるかな？';
    } else {
      hint.innerHTML = '<strong>【分解モードの操作ヒント】</strong><br>赤色の矢印（元の力）の先端や、点線（分解する方向の軸）上の丸をドラッグしてみよう。元の力を2つの方向に分解したときの「分力（青と緑）」が平行四辺形によって決まる様子が分かります。';
    }
    render();
  }

  // 矢印描画関数
  function drawArrow(fromX, fromY, toX, toY, color, width = 3) {
    const len = Math.hypot(toX - fromX, toY - fromY);
    if (len < 5) return;
    const headlen = 14;
    const angle = Math.atan2(toY - fromY, toX - fromX);
    
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.moveTo(fromX, fromY);
    ctx.lineTo(toX, toY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
  }

  // マス目描画
  function drawGrid() {
    ctx.strokeStyle = '#e9ecef';
    ctx.lineWidth = 1;
    const step = 20;
    for (let x = 0; x < canvas.width; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += step) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (document.getElementById('chkGrid').checked) drawGrid();

    // 作用点
    ctx.beginPath();
    ctx.arc(origin.x, origin.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#212529';
    ctx.fill();

    const showValues = document.getElementById('chkValues').checked;

    if (mode === 'combine') {
      // --- 【合成モード】 ---
      const pA = { x: origin.x + vA.x, y: origin.y + vA.y };
      const pB = { x: origin.x + vB.x, y: origin.y + vB.y };
      const pRes = { x: origin.x + vA.x + vB.x, y: origin.y + vA.y + vB.y };

      // 平行四辺形 (点線)
      ctx.beginPath();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#8d99ae';
      ctx.lineWidth = 2;
      ctx.moveTo(pA.x, pA.y); ctx.lineTo(pRes.x, pRes.y);
      ctx.moveTo(pB.x, pB.y); ctx.lineTo(pRes.x, pRes.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 矢印描画
      drawArrow(origin.x, origin.y, pA.x, pA.y, '#1d3557', 4); // 分力A
      drawArrow(origin.x, origin.y, pB.x, pB.y, '#2a9d8f', 4); // 分力B
      drawArrow(origin.x, origin.y, pRes.x, pRes.y, '#e63946', 5); // 合力

      // 数値表示
      if (showValues) {
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#1d3557'; ctx.fillText(`A: ${(Math.hypot(vA.x, vA.y)/20).toFixed(1)} N`, pA.x + 10, pA.y);
        ctx.fillStyle = '#2a9d8f'; ctx.fillText(`B: ${(Math.hypot(vB.x, vB.y)/20).toFixed(1)} N`, pB.x + 10, pB.y);
        ctx.fillStyle = '#e63946'; ctx.fillText(`合力: ${(Math.hypot(vA.x + vB.x, vA.y + vB.y)/20).toFixed(1)} N`, pRes.x + 10, pRes.y);
      }

    } else {
      // --- 【分解モード】 ---
      const pRes = { x: origin.x + vResult.x, y: origin.y + vResult.y };

      // 軸ベクトル
      const uA = { x: Math.cos(angleAxisA), y: Math.sin(angleAxisA) };
      const uB = { x: Math.cos(angleAxisB), y: Math.sin(angleAxisB) };

      // ベクトルの分解計算 (連立方程式)
      // vResult = cA * uA + cB * uB
      const det = uA.x * uB.y - uA.y * uB.x;
      let cA = 0, cB = 0;
      if (Math.abs(det) > 0.001) {
        cA = (vResult.x * uB.y - vResult.y * uB.x) / det;
        cB = (uA.x * vResult.y - uA.y * vResult.x) / det;
      }

      const pA = { x: origin.x + cA * uA.x, y: origin.y + cA * uA.y };
      const pB = { x: origin.x + cB * uB.x, y: origin.y + cB * uB.y };

      // 分解のガイド軸（長い点線）
      ctx.beginPath();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = '#adb5bd';
      ctx.lineWidth = 1.5;
      ctx.moveTo(origin.x - uA.x * 300, origin.y - uA.y * 300);
      ctx.lineTo(origin.x + uA.x * 300, origin.y + uA.y * 300);
      ctx.moveTo(origin.x - uB.x * 300, origin.y - uB.y * 300);
      ctx.lineTo(origin.x + uB.x * 300, origin.y + uB.y * 300);
      ctx.stroke();

      // 平行四辺形 (点線)
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#8d99ae';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pA.x, pA.y); ctx.lineTo(pRes.x, pRes.y);
      ctx.moveTo(pB.x, pB.y); ctx.lineTo(pRes.x, pRes.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 軸調整用ハンドル（円）
      const handleA = { x: origin.x + uA.x * 180, y: origin.y + uA.y * 180 };
      const handleB = { x: origin.x + uB.x * 180, y: origin.y + uB.y * 180 };
      ctx.beginPath(); ctx.arc(handleA.x, handleA.y, 6, 0, Math.PI * 2); ctx.fillStyle = '#1d3557'; ctx.fill();
      ctx.beginPath(); ctx.arc(handleB.x, handleB.y, 6, 0, Math.PI * 2); ctx.fillStyle = '#2a9d8f'; ctx.fill();

      // 矢印描画
      drawArrow(origin.x, origin.y, pA.x, pA.y, '#1d3557', 4); // 分力A
      drawArrow(origin.x, origin.y, pB.x, pB.y, '#2a9d8f', 4); // 分力B
      drawArrow(origin.x, origin.y, pRes.x, pRes.y, '#e63946', 5); // 元の力

      // 数値表示
      if (showValues) {
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#1d3557'; ctx.fillText(`分力A: ${(Math.abs(cA)/20).toFixed(1)} N`, pA.x + 10, pA.y);
        ctx.fillStyle = '#2a9d8f'; ctx.fillText(`分力B: ${(Math.abs(cB)/20).toFixed(1)} N`, pB.x + 10, pB.y);
        ctx.fillStyle = '#e63946'; ctx.fillText(`元の力: ${(Math.hypot(vResult.x, vResult.y)/20).toFixed(1)} N`, pRes.x + 10, pRes.y);
      }
    }
  }

  // イベント処理（Pointer Events：マウス・タッチ・ペン共通）
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    // CSSで縮小表示されても内部座標(650x420)に正しく変換する
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function onStart(e) {
    const pos = getPos(e);
    // 縮小表示時・タッチ操作時でも掴みやすいよう、判定半径を実表示スケールに合わせる
    const rect = canvas.getBoundingClientRect();
    const hitR = 25 * Math.max(1, canvas.width / rect.width);
    if (mode === 'combine') {
      const pA = { x: origin.x + vA.x, y: origin.y + vA.y };
      const pB = { x: origin.x + vB.x, y: origin.y + vB.y };
      if (Math.hypot(pos.x - pA.x, pos.y - pA.y) < hitR) activeHandle = 'A';
      else if (Math.hypot(pos.x - pB.x, pos.y - pB.y) < hitR) activeHandle = 'B';
    } else {
      const pRes = { x: origin.x + vResult.x, y: origin.y + vResult.y };
      const handleA = { x: origin.x + Math.cos(angleAxisA) * 180, y: origin.y + Math.sin(angleAxisA) * 180 };
      const handleB = { x: origin.x + Math.cos(angleAxisB) * 180, y: origin.y + Math.sin(angleAxisB) * 180 };

      if (Math.hypot(pos.x - pRes.x, pos.y - pRes.y) < hitR) activeHandle = 'Res';
      else if (Math.hypot(pos.x - handleA.x, pos.y - handleA.y) < hitR) activeHandle = 'AxisA';
      else if (Math.hypot(pos.x - handleB.x, pos.y - handleB.y) < hitR) activeHandle = 'AxisB';
    }
  }

  function onMove(e) {
    if (!activeHandle) return;
    const pos = getPos(e);
    const dx = pos.x - origin.x;
    const dy = pos.y - origin.y;

    if (mode === 'combine') {
      if (activeHandle === 'A') vA = { x: dx, y: dy };
      if (activeHandle === 'B') vB = { x: dx, y: dy };
    } else {
      if (activeHandle === 'Res') vResult = { x: dx, y: dy };
      if (activeHandle === 'AxisA') angleAxisA = Math.atan2(dy, dx);
      if (activeHandle === 'AxisB') angleAxisB = Math.atan2(dy, dx);
    }
    render();
  }

  function onEnd() { activeHandle = null; }

  // Pointer Events に一本化（マウス/タッチの二重発火を防止）
  canvas.addEventListener('pointerdown', (e) => {
    onStart(e);
    if (activeHandle) {
      e.preventDefault();
      // ドラッグ中に指がキャンバス外へ出ても追従させる
      if (canvas.setPointerCapture) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
    }
  });
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onEnd);
  canvas.addEventListener('pointercancel', onEnd);
  window.addEventListener('pointerup', onEnd);

  render();
</script>

</body>
</html>
