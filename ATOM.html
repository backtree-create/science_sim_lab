<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>3D原子構造・静電気シミュレーター</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: none;
            color: #0f172a;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        /* HUD UI */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #0f172a;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1::after {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #0284c7;
            border-radius: 50%;
        }
        .control-group {
            margin-bottom: 14px;
        }
        label {
            font-size: 11px;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            color: #475569;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        select:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        button {
            width: 100%;
            padding: 10px 14px;
            touch-action: manipulation;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: #0f172a;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: #ffffff;
            color: #334155;
            border-color: #cbd5e1;
        }
        .btn-secondary:hover {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #94a3b8;
        }
        #charge-status-card {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }
        #charge-status-title {
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }
        #charge-status-val {
            font-size: 13px;
            font-weight: 600;
            color: #0284c7;
        }
        #info-box {
            font-size: 11px;
            color: #475569;
            line-height: 1.5;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 4px;
        }
        @media (max-width: 600px) {
            #ui-panel {
                top: 12px;
                left: 12px;
                width: min(280px, calc(100vw - 24px));
                padding: 14px;
                max-height: calc(100vh - 24px);
                max-height: calc(100dvh - 24px);
                overflow-y: auto;
            }
        }
        @media (pointer: coarse) {
            button, select {
                min-height: 44px;
            }
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="ui-panel">
        <h1>Atom Model</h1>
        
        <div class="control-group">
            <label>元素選択</label>
            <select id="element-select">
                <option value="H">水素 (H)</option>
                <option value="He">ヘリウム (He)</option>
                <option value="Li">リチウム (Li)</option>
                <option value="C" selected>炭素 (C)</option>
            </select>
        </div>

        <div id="charge-status-card">
            <div id="charge-status-title">帯電状態</div>
            <div id="charge-status-val">電気的中性 (±0)</div>
        </div>

        <div class="control-group">
            <button id="btn-rub" class="btn-primary">紙で擦り取る</button>
            <button id="btn-reset" class="btn-secondary">放電（電子リセット）</button>
            <button id="btn-force" class="btn-secondary">引力ライン表示 切替</button>
        </div>

        <div id="info-box">
            明瞭なカラーモデルにより、白背景下でも電子の挙動や原子核構造を高コントラストで観察可能です。
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8fafc);
        scene.fog = new THREE.FogExp2(0xf8fafc, 0.0012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 24);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // ライティング（明瞭な立体感を与える光）
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(15, 30, 20);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x0284c7, 0.6, 50);
        pointLight.position.set(-10, -10, -10);
        scene.add(pointLight);

        // 元素定義
        const elements = {
            'H':  { p: 1, n: 0, e: 1, shells: [1] },
            'He': { p: 2, n: 2, e: 2, shells: [2] },
            'Li': { p: 3, n: 4, e: 3, shells: [2, 1] },
            'C':  { p: 6, n: 6, e: 6, shells: [2, 4] }
        };

        let currentElement = 'C';
        let showForces = true;
        let escapedElectronsCount = 0;
        let isRubbingAnimation = false;

        const nucleusGroup = new THREE.Group();
        const electronGroup = new THREE.Group();
        const forceGroup = new THREE.Group();
        
        scene.add(nucleusGroup);
        scene.add(electronGroup);
        scene.add(forceGroup);

        // 白背景用・高コントラストマテリアル設定
        const protonMat = new THREE.MeshStandardMaterial({ 
            color: 0xe11d48, // 鮮明なローズレッド（陽子）
            roughness: 0.2, 
            metalness: 0.1 
        });
        const neutronMat = new THREE.MeshStandardMaterial({ 
            color: 0x475569, // ダークスレートグレー（中性子: 背景から浮き立つ濃色）
            roughness: 0.3, 
            metalness: 0.1 
        });
        const electronMat = new THREE.MeshStandardMaterial({ 
            color: 0x0284c7, // ディープディープシアン（電子: 白地でくっきり見える青）
            emissive: 0x0369a1, 
            emissiveIntensity: 0.4, 
            roughness: 0.2 
        });
        const forceMat = new THREE.LineDashedMaterial({ 
            color: 0xd97706, // 濃いアンバーオレンジ（引力線: 非常に高い視認性）
            dashSize: 0.2, 
            gapSize: 0.1, 
            opacity: 0.75, 
            transparent: true 
        });

        // 帯電オーラ
        const auraMat = new THREE.MeshBasicMaterial({ color: 0xe11d48, transparent: true, opacity: 0.0, side: THREE.BackSide });
        const auraMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), auraMat);
        scene.add(auraMesh);

        // スポットライト透視シェーダー（輪郭を際立たせる調整）
        const spotShaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                u_hoverPoint: { value: new THREE.Vector3(0, 0, 0) },
                u_isHovered: { value: 0.0 },
                u_spotRadius: { value: 1.8 },
                u_color: { value: new THREE.Color(0x0284c7) }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vWorldPosition;
                varying vec3 vNormal;
                uniform vec3 u_hoverPoint;
                uniform float u_isHovered;
                uniform float u_spotRadius;
                uniform vec3 u_color;

                void main() {
                    vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.5);
                    float alpha = 0.15 + fresnel * 0.4;

                    if (u_isHovered > 0.5) {
                        float dist = distance(vWorldPosition, u_hoverPoint);
                        float hole = smoothstep(0.0, u_spotRadius, dist);
                        alpha *= (0.02 + 0.98 * hole);
                    }

                    gl_FragColor = vec4(u_color, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        const nucleusOuterShell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), spotShaderMaterial);
        scene.add(nucleusOuterShell);

        // 紙モデル（黒寄りチャコールグレー）
        const paperGroup = new THREE.Group();
        const paperGeo = new THREE.PlaneGeometry(6, 8, 16, 16);
        const posAttr = paperGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            posAttr.setZ(i, Math.sin(x * 0.5) * 0.3);
        }
        paperGeo.computeVertexNormals();

        const paperMat = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            roughness: 0.5,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const paperMesh = new THREE.Mesh(paperGeo, paperMat);
        paperMesh.rotation.x = Math.PI / 2;
        paperGroup.add(paperMesh);

        const paperEdges = new THREE.LineSegments(
            new THREE.EdgesGeometry(paperGeo),
            new THREE.LineBasicMaterial({ color: 0x64748b })
        );
        paperMesh.add(paperEdges);

        paperGroup.position.set(30, 0, 0);
        scene.add(paperGroup);

        let electronsData = [];

        function buildAtom() {
            electronsData.forEach(e => {
                if (e.mesh && e.mesh.parent) {
                    e.mesh.parent.remove(e.mesh);
                }
            });

            while(nucleusGroup.children.length) nucleusGroup.remove(nucleusGroup.children[0]);
            while(electronGroup.children.length) electronGroup.remove(electronGroup.children[0]);
            while(forceGroup.children.length) forceGroup.remove(forceGroup.children[0]);
            
            electronsData = [];
            escapedElectronsCount = 0;
            isRubbingAnimation = false;
            paperGroup.position.set(30, 0, 0);
            updateChargeUI();

            const config = elements[currentElement];

            // 原子核構築
            const totalNucleons = config.p + config.n;
            const nucleons = [];
            for(let i=0; i<config.p; i++) nucleons.push('p');
            for(let i=0; i<config.n; i++) nucleons.push('n');
            nucleons.sort(() => Math.random() - 0.5);

            const nRadius = 0.38;
            nucleons.forEach((type, idx) => {
                const geo = new THREE.SphereGeometry(nRadius, 32, 32);
                const mesh = new THREE.Mesh(geo, type === 'p' ? protonMat : neutronMat);
                
                const phi = Math.acos(-1 + (2 * idx) / totalNucleons);
                const theta = Math.sqrt(totalNucleons * Math.PI) * phi;
                const r = Math.pow(idx / totalNucleons, 0.5) * (nRadius * 1.25);
                
                mesh.position.set(r * Math.cos(theta) * Math.sin(phi), r * Math.sin(theta) * Math.sin(phi), r * Math.cos(phi));
                nucleusGroup.add(mesh);
            });

            const nSize = Math.max(1.3, Math.pow(totalNucleons, 1/3) * 0.88);
            nucleusOuterShell.scale.set(nSize, nSize, nSize);
            auraMesh.scale.set(nSize * 1.35, nSize * 1.35, nSize * 1.35);
            spotShaderMaterial.uniforms.u_spotRadius.value = nSize * 0.9;

            // 電子と軌道構築（軌道ガイド線のコントラスト強化）
            const baseDistances = [5.5, 9.5];

            config.shells.forEach((count, shellIdx) => {
                const radius = baseDistances[shellIdx];
                const shellGroup = new THREE.Group();
                shellGroup.rotation.x = shellIdx * 0.35;
                shellGroup.rotation.z = shellIdx * 0.15;
                electronGroup.add(shellGroup);

                // 白背景で視認しやすいスレートグレーの軌道リング
                const orbitGeo = new THREE.BufferGeometry();
                const points = [];
                for(let i=0; i<=128; i++){
                    const theta = (i/128) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
                }
                orbitGeo.setFromPoints(points);
                shellGroup.add(new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x64748b, opacity: 0.45, transparent: true })));

                for(let i=0; i<count; i++) {
                    const eMesh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), electronMat);
                    shellGroup.add(eMesh);

                    const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    const forceLine = new THREE.Line(lineGeo, forceMat);
                    forceGroup.add(forceLine);

                    electronsData.push({
                        mesh: eMesh,
                        shellGroup: shellGroup,
                        shellIdx: shellIdx,
                        forceLine: forceLine,
                        radius: radius,
                        angle: (i / count) * Math.PI * 2,
                        speed: 0.018 / (shellIdx + 1),
                        isValence: shellIdx === config.shells.length - 1,
                        isEscaped: false,
                        paperRelativePos: new THREE.Vector3()
                    });
                }
            });
        }

        function updateChargeUI() {
            const valEl = document.getElementById('charge-status-val');
            const cardEl = document.getElementById('charge-status-card');

            if (escapedElectronsCount === 0) {
                valEl.innerText = "電気的中性 (±0)";
                valEl.style.color = "#0284c7";
                cardEl.style.borderColor = "#e2e8f0";
                cardEl.style.background = "#f1f5f9";
                auraMat.opacity = 0.0;
            } else {
                valEl.innerText = `正に帯電 (+${escapedElectronsCount})`;
                valEl.style.color = "#e11d48";
                cardEl.style.borderColor = "#fecdd3";
                cardEl.style.background = "#fff1f2";
                auraMat.opacity = Math.min(0.5, escapedElectronsCount * 0.22);
            }
        }

        // 紙擦りアニメーション
        document.getElementById('btn-rub').addEventListener('click', () => {
            if (isRubbingAnimation) return;

            const boundValence = electronsData.filter(e => e.isValence && !e.isEscaped);
            if (boundValence.length === 0) return;

            isRubbingAnimation = true;
            const targetElectron = boundValence[Math.floor(Math.random() * boundValence.length)];

            let progress = 0;
            const startX = 18;
            const endX = -18;
            const targetRadius = targetElectron.radius;

            function animatePaper() {
                progress += 0.025;

                const currentX = THREE.MathUtils.lerp(startX, endX, progress);
                const currentY = Math.sin(progress * Math.PI) * 2;
                const currentZ = targetRadius * Math.cos((progress - 0.5) * Math.PI);

                paperGroup.position.set(currentX, currentY, currentZ);
                paperGroup.rotation.y = Math.sin(progress * Math.PI) * 0.3;

                if (progress >= 0.45 && !targetElectron.isEscaped) {
                    targetElectron.isEscaped = true;
                    targetElectron.paperRelativePos.set(
                        (Math.random() - 0.5) * 3,
                        0.2,
                        (Math.random() - 0.5) * 4
                    );
                    scene.attach(targetElectron.mesh);
                    escapedElectronsCount++;
                    updateChargeUI();
                }

                if (targetElectron.isEscaped) {
                    const worldPaperPos = paperGroup.position.clone().add(targetElectron.paperRelativePos);
                    targetElectron.mesh.position.lerp(worldPaperPos, 0.2);
                }

                if (progress < 1.0) {
                    requestAnimationFrame(animatePaper);
                } else {
                    isRubbingAnimation = false;
                }
            }

            animatePaper();
        });

        // 放電（等間隔リセット）
        document.getElementById('btn-reset').addEventListener('click', () => {
            isRubbingAnimation = false;
            paperGroup.position.set(30, 0, 0);

            const shellsMap = {};
            electronsData.forEach(e => {
                if (!shellsMap[e.shellIdx]) shellsMap[e.shellIdx] = [];
                shellsMap[e.shellIdx].push(e);
            });

            Object.keys(shellsMap).forEach(shellIdx => {
                const list = shellsMap[shellIdx];
                const count = list.length;
                list.forEach((e, idx) => {
                    if (e.isEscaped) {
                        e.isEscaped = false;
                        e.shellGroup.attach(e.mesh);
                    }
                    e.angle = (idx / count) * Math.PI * 2;
                });
            });

            escapedElectronsCount = 0;
            updateChargeUI();
        });

        // 局所透視レイキャスト
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-100, -100);
        function updatePointer(x, y) {
            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(nucleusOuterShell);
            if (intersects.length > 0) {
                spotShaderMaterial.uniforms.u_hoverPoint.value.copy(intersects[0].point);
                spotShaderMaterial.uniforms.u_isHovered.value = 1.0;
            } else {
                spotShaderMaterial.uniforms.u_isHovered.value = 0.0;
            }
        }
        // Pointer Events cover mouse, touch and pen — a separate touchmove
        // listener would double-fire on touch devices, so only pointermove is used.
        window.addEventListener('pointermove', (e) => updatePointer(e.clientX, e.clientY));
        window.addEventListener('pointercancel', () => {
            spotShaderMaterial.uniforms.u_isHovered.value = 0.0;
        });

        document.getElementById('element-select').addEventListener('change', (e) => {
            currentElement = e.target.value;
            buildAtom();
        });

        const forceBtn = document.getElementById('btn-force');
        forceBtn.addEventListener('click', () => {
            showForces = !showForces;
            forceGroup.visible = showForces;
        });

        buildAtom();

        const tempPos = new THREE.Vector3();
        const targetOrbitPos = new THREE.Vector3();

        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);

            electronsData.forEach((e) => {
                if (!e.isEscaped) {
                    e.angle += e.speed;
                    targetOrbitPos.set(
                        Math.cos(e.angle) * e.radius,
                        0,
                        Math.sin(e.angle) * e.radius
                    );
                    e.mesh.position.lerp(targetOrbitPos, 0.12);
                } else if (!isRubbingAnimation) {
                    const worldPaperPos = paperGroup.position.clone().add(e.paperRelativePos);
                    e.mesh.position.lerp(worldPaperPos, 0.1);
                }

                if (showForces) {
                    e.mesh.getWorldPosition(tempPos);
                    const positions = e.forceLine.geometry.attributes.position.array;
                    positions[0] = 0; positions[1] = 0; positions[2] = 0;
                    positions[3] = tempPos.x; positions[4] = tempPos.y; positions[5] = tempPos.z;
                    e.forceLine.geometry.attributes.position.needsUpdate = true;
                    e.forceLine.computeLineDistances();
                }
            });

            nucleusGroup.rotation.y += 0.0025;
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
