<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中1理科：凸レンズの働きと作図シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  :root{--accent:var(--highlight);--accent-soft:var(--highlight-soft);}
  .layout{grid-template-columns:1.6fr 1fr;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}
  #simCanvas{display:block;width:100%;height:auto;touch-action:manipulation;}
  .stage{padding:0;}
  .tabbar{margin-bottom:18px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← ホームへ</a>
  <span class="unit-title">08 ／ 凸レンズの働きと作図</span>
</div>

<div class="sim-header">
  <span class="eyebrow">Convex Lens · Ray Diagram</span>
  <h1>凸レンズの働きと光の進み方</h1>
</div>

<div class="layout">

  <div class="panel flush">
    <div class="stage">
      <canvas id="simCanvas" width="700" height="380"></canvas>
    </div>
    <div class="statusline on" id="statusText"></div>
  </div>

  <div class="panel">
    <h2><span class="dot"></span>コントロール</h2>

    <div class="tabs tabbar">
      <button class="tab active" id="btnMode1" onclick="setMode('rays3')">① 作図の3本の光</button>
      <button class="tab" id="btnMode2" onclick="setMode('parallel')">② 平行な3本の光</button>
    </div>

    <div class="controls">
      <div class="control">
        <label for="focalSlider">焦点距離 f<span class="val"><span id="focalVal">90</span> px</span></label>
        <input type="range" id="focalSlider" min="50" max="130" value="90" oninput="render()">
      </div>

      <div class="control" id="objPosGroup">
        <label for="objSlider">物体の位置<span class="val"><span id="objVal">180</span> px</span></label>
        <input type="range" id="objSlider" min="30" max="260" value="180" oninput="render()">
      </div>
    </div>

    <hr class="divider">

    <div class="legend" id="legendBox">
      <div class="item"><span class="sw dot" style="background:#1f7fd0;"></span>① 軸に平行な光 ➔ 焦点を通る</div>
      <div class="item"><span class="sw dot" style="background:#219a5d;"></span>② 中心を通る光 ➔ 直進する</div>
      <div class="item"><span class="sw dot" style="background:#7c3aed;"></span>③ 焦点を通る光 ➔ 軸に平行に進む</div>
    </div>

    <div class="hint" id="hintBox" style="margin-top:16px">
      <span class="hint-title">作図の3本の光と像のポイント</span>
      <ul>
        <li><strong>実像：</strong> 光が実際に集まってできる上下左右が逆の像（物体が焦点の外側にあるとき）。</li>
        <li><strong>虚像：</strong> レンズをのぞいたときに見える正立の大きな像（物体が焦点の内側にあるとき）。</li>
        <li><strong>焦点の2倍の位置：</strong> 物体を焦点の2倍の位置に置くと、同じ大きさの実像ができます。</li>
      </ul>
    </div>
  </div>

</div>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');

  // 論理座標系は 700x380 のまま、高解像度画面では実解像度のみ上げる
  const BASE_W = 700, BASE_H = 380;
  function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = BASE_W * dpr;
    canvas.height = BASE_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let currentMode = 'rays3'; // 'rays3' または 'parallel'

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnMode1').classList.toggle('active', mode === 'rays3');
    document.getElementById('btnMode2').classList.toggle('active', mode === 'parallel');
    document.getElementById('objPosGroup').style.display = mode === 'rays3' ? 'flex' : 'none';
    
    const legend = document.getElementById('legendBox');
    const hint = document.getElementById('hintBox');

    if (mode === 'rays3') {
      legend.style.display = 'flex';
      hint.innerHTML = '<span class="hint-title">作図の3本の光と像のポイント</span><ul>'
        + '<li><strong>実像：</strong> 光が実際に集まってできる上下左右が逆の像（物体が焦点の外側にあるとき）。</li>'
        + '<li><strong>虚像：</strong> レンズをのぞいたときに見える正立の大きな像（物体が焦点の内側にあるとき）。</li>'
        + '<li><strong>焦点の2倍の位置：</strong> 物体を焦点の2倍の位置に置くと、同じ大きさの実像ができます。</li></ul>';
    } else {
      legend.style.display = 'none';
      hint.innerHTML = '<span class="hint-title">平行な光の集まり方</span><ul>'
        + '<li>主軸に平行に入った光は、すべて反対側の<strong>「焦点」</strong>に集まります。</li>'
        + '<li>スライダーで焦点距離を変えると、光が集まる位置が変化する様子が分かります。</li></ul>';
    }
    render();
  }

  function drawArrow(x, y, height, color, isDashed = false) {
    ctx.save();
    if (isDashed) ctx.setLineDash([4, 4]);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - height);
    ctx.stroke();

    // 矢印の頭
    const head = height > 0 ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(x, y - height);
    ctx.lineTo(x - 6, y - height - head * 10);
    ctx.lineTo(x + 6, y - height - head * 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function render() {
    const f = parseFloat(document.getElementById('focalSlider').value);
    const doPos = parseFloat(document.getElementById('objSlider').value);
    
    document.getElementById('focalVal').innerText = f;
    document.getElementById('objVal').innerText = doPos;

    const W = BASE_W;
    const H = BASE_H;
    const cX = W / 2; // レンズの中心X
    const cY = H / 2; // 主軸Y

    ctx.clearRect(0, 0, W, H);

    // 背景の方眼（作図用紙のイメージ）
    ctx.save();
    ctx.strokeStyle = 'rgba(17,23,38,.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 25) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 25) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
    ctx.restore();

    // 主軸（中央の横線）
    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = '#8a94a8';
    ctx.lineWidth = 1.5;
    ctx.moveTo(10, cY + .5); ctx.lineTo(W - 10, cY + .5);
    ctx.stroke();
    ctx.restore();

    // レンズ中心軸（縦点線）— レンズより先に描き、ガラスの下に潜らせる
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#c3c9d6';
    ctx.lineWidth = 1;
    ctx.moveTo(cX, 16); ctx.lineTo(cX, H - 16);
    ctx.stroke();
    ctx.restore();

    // 凸レンズの描画（ガラスらしい縦グラデーション＋ハイライト）
    ctx.save();
    const lensGrad = ctx.createLinearGradient(cX - 18, 0, cX + 18, 0);
    lensGrad.addColorStop(0,   'rgba(96,165,250,.34)');
    lensGrad.addColorStop(.42, 'rgba(191,219,254,.20)');
    lensGrad.addColorStop(1,   'rgba(96,165,250,.34)');
    ctx.beginPath();
    ctx.ellipse(cX, cY, 18, 140, 0, 0, Math.PI * 2);
    ctx.fillStyle = lensGrad;
    ctx.fill();
    ctx.strokeStyle = '#1f7fd0';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 表面のハイライト
    ctx.beginPath();
    ctx.ellipse(cX - 7, cY - 34, 3.2, 52, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fill();
    ctx.restore();

    // 焦点 (F, 2F) の描画
    drawPoint(cX - f, cY, 'F');
    drawPoint(cX + f, cY, 'F');
    drawPoint(cX - 2 * f, cY, '2F');
    drawPoint(cX + 2 * f, cY, '2F');

    const statusEl = document.getElementById('statusText');

    if (currentMode === 'parallel') {
      // --- 【モード2：平行な3本の光】 ---
      statusEl.innerText = '主軸に平行な光は、すべてレンズ反対側の焦点に集まります';

      const offsets = [-60, 0, 60];
      offsets.forEach(offY => {
        const startY = cY + offY;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#e2503a';
        // 入射光（平行）→ 屈折光（焦点Fへ）を一筆で
        for (const pass of [{ a: .18, w: 8 }, { a: 1, w: 2.6 }]) {
          ctx.globalAlpha = pass.a;
          ctx.lineWidth = pass.w;
          ctx.beginPath();
          ctx.moveTo(30, startY);
          ctx.lineTo(cX, startY);
          ctx.lineTo(cX + f * 2.2, cY + (offY === 0 ? 0 : (cY - startY) * 1.2));
          ctx.stroke();
        }
        ctx.restore();

        // 矢印マーク
        drawRayArrow(cX - 100, startY, 1, 0, '#e2503a');
      });

    } else {
      // --- 【モード1：作図の3本の光】 ---
      const ho = 60; // 物体の高さ
      const objX = cX - doPos;
      const objY = cY;

      // 物体（赤矢印）
      drawArrow(objX, objY, ho, '#e2503a');
      ctx.fillStyle = '#e2503a';
      ctx.font = '700 12.5px "JetBrains Mono", monospace';
      ctx.fillText('物体', objX - 12, objY + 18);

      const topX = objX;
      const topY = cY - ho;

      if (Math.abs(doPos - f) < 3) {
        // --- 焦点上にある場合 ---
        statusEl.innerText = '⚠️ 物体が焦点上にあるため、光が平行になり「像はできません」';

        // 光線1（平行 ➔ 焦点）
        drawLine(topX, topY, cX, topY, '#1f7fd0');
        drawLine(cX, topY, cX + f * 2, topY + f * 2, '#1f7fd0');

        // 光線2（中心直進）
        drawLine(topX, topY, cX + f * 2, cY + ho * 2, '#219a5d');

      } else if (doPos > f) {
        // --- 実像ができる場合 ($d_o > f$) ---
        const di = (f * doPos) / (doPos - f); // レンズ法則 1/di = 1/f - 1/do
        const hi = ho * (di / doPos); // 像の高さ
        const imgX = cX + di;
        const imgY = cY + hi; // 下向き

        // 状態テキスト判定
        if (Math.abs(doPos - 2 * f) < 4) {
          statusEl.innerText = '✨ 焦点の2倍の位置：同じ大きさの「倒立実像」';
        } else if (doPos > 2 * f) {
          statusEl.innerText = '✨ 焦点の2倍より遠い：縮小された「倒立実像」';
        } else {
          statusEl.innerText = '✨ 焦点と2倍の間：拡大された「倒立実像」';
        }

        // 実像の描画
        if (imgX < W - 20) {
          drawArrow(imgX, cY, -hi, '#1f7fd0');
          ctx.fillStyle = '#1f7fd0';
          ctx.fillText('実像', imgX - 12, cY + (hi > 0 ? hi + 18 : -hi - 10));
        }

        // 光線1（青）：平行 ➔ レンズ ➔ 焦点 ➔ 像の先端
        drawLine(topX, topY, cX, topY, '#1f7fd0');
        drawLine(cX, topY, imgX, imgY, '#1f7fd0');

        // 光線2（緑）：中心直進 ➔ 像の先端
        drawLine(topX, topY, imgX, imgY, '#219a5d');

        // 光線3（紫）：手前焦点 ➔ レンズ ➔ 平行 ➔ 像の先端
        drawLine(topX, topY, cX, cY + hi, '#7c3aed');
        drawLine(cX, cY + hi, imgX, imgY, '#7c3aed');

      } else {
        // --- 虚像ができる場合 ($d_o < f$) ---
        const di = (f * doPos) / (f - doPos); // レンズの左側への距離
        const hi = ho * (di / doPos); // 拡大率
        const imgX = cX - di;
        const imgY = cY - hi;

        statusEl.innerText = '🔍 焦点の内側：レンズの中に拡大された「正立虚像」が見える';

        // 虚像の描画（点線）
        drawArrow(imgX, cY, hi, '#c1362a', true);
        ctx.fillStyle = '#c1362a';
        ctx.fillText('虚像', imgX - 12, cY + 18);

        // 光線1（青）：平行 ➔ レンズ ➔ 右下へ（反対側の焦点経由）
        drawLine(topX, topY, cX, topY, '#1f7fd0');
        drawLine(cX, topY, cX + f * 1.5, topY + 1.5 * ho, '#1f7fd0');
        // 光線1延長（点線）
        drawDashedLine(cX, topY, imgX, imgY, '#1f7fd0');

        // 光線2（緑）：中心直進（右下へ）
        drawLine(topX, topY, cX + 100, cY + (100 / doPos) * ho, '#219a5d');
        // 光線2延長（点線）
        drawDashedLine(cX, cY, imgX, imgY, '#219a5d');

        // 光線3（紫）：手前焦点からの延長上 ➔ レンズ ➔ 右へ平行
        const lensY3 = cY - (f / (f - doPos)) * ho;
        drawLine(topX, topY, cX, lensY3, '#7c3aed');
        drawLine(cX, lensY3, cX + 150, lensY3, '#7c3aed');
        // 光線3延長（点線）
        drawDashedLine(cX, lensY3, imgX, imgY, '#7c3aed');
      }
    }
  }

  function drawPoint(x, y, label) {
    if (x < 10 || x > BASE_W - 10) return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#3b4557';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = '500 11.5px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#5a6478';
    ctx.fillText(label, x, y + 10);
    ctx.restore();
  }

  function drawLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.lineCap = 'round';
    // 光の芯のまわりに淡いにじみを添える
    ctx.globalAlpha = .18;
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 7;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.lineWidth = 2.2;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function drawDashedLine(x1, y1, x2, y2, color) {
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function drawRayArrow(x, y, dx, dy, color) {
    const angle = Math.atan2(dy, dx);
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 8 * Math.cos(angle - Math.PI / 6), y - 8 * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x - 8 * Math.cos(angle + Math.PI / 6), y - 8 * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  setupCanvas();
  render();
  window.addEventListener('resize', function() { setupCanvas(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>

</body>
</html>
